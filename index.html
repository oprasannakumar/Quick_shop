    </div>

    <script>
        /* ── PWA SERVICE WORKER SETUP ── */
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        /* ── CONSTANTS & VARS ── */
        const API_URL = "https://script.google.com/macros/s/AKfycbzRt_ad2rXgZNVO4_Nlumm8EAxN7jcG7gG1y0yKEec7WXnws68ygcAqrhCjRzcmdWzl/exec";
        const API_KEY = "9848o22338B!";
        const TASK_API_URL = "https://script.google.com/macros/s/AKfycbz0d_gOUxq6w7geJvlt9R1hUaR8aLItOBsI1p3Cd6UCS2p1lCGvaAzVWG7rVK2tMJnE7Q/exec";

        let groceries = {},
            dealers = [],
            categories = [],
            cart = {};
        let cartSortMode = 'aisle',
            selectedItem = '';
        let activeDealerFilter = 'Every store',
            activeCategoryFilter = null;
        let activeSearchFilter = '';

        const catColorMap = {
            'Produce': 'var(--cat-yellow)',
            'Snacks & Beverages': 'var(--cat-pink)',
            'Pantry & Spices': 'var(--cat-peach)',
            'Household': 'var(--cat-teal)',
            'Dairy & Eggs': 'var(--cat-peach)',
            'Meat & Seafood': 'var(--cat-pink)'
        };

        /* ── BOOT ── */
        window.onload = () => {
            const cg = localStorage.getItem('grocery_catalog');
            if (cg) { groceries = JSON.parse(cg);
                initData();
                renderShopGrid(); }
            const cc = localStorage.getItem('grocery_cart');
            if (cc) { cart = JSON.parse(cc);
                renderBasket(); }
            initAlphaScroll();
            if (navigator.onLine) fetchData();
        };

        function fetchData() {
            fetch(`${API_URL}?key=${API_KEY}`).then(r => r.json()).then(d => {
                groceries = d || {};
                localStorage.setItem('grocery_catalog', JSON.stringify(groceries));
                initData();
                renderShopGrid();
            }).catch(() => {});
        }

        /* ── TOAST AUTO-DISMISS ── */
        function toast(msg) {
            const t = document.getElementById('toast');
            t.innerHTML = msg;
            t.classList.remove('hide');
            t.classList.add('show');
            t.style.display = 'flex';
            clearTimeout(t._t1);
            clearTimeout(t._t2);
            t._t1 = setTimeout(() => {
                t.classList.remove('show');
                t.classList.add('hide');
                t._t2 = setTimeout(() => {
                    t.classList.remove('hide');
                    t.style.display = 'none';
                }, 250);
            }, 2200);
        }

        /* ── THEMED SELECTION POPUP SYSTEM ── */
        function openSelectPopup(title, options, selectedVal, onSelect) {
            const overlay = document.getElementById('selectPopupOverlay');
            const titleEl = document.getElementById('selectPopupTitle');
            const listEl = document.getElementById('selectPopupList');

            titleEl.textContent = title;
            listEl.innerHTML = '';

            options.forEach(opt => {
                const div = document.createElement('div');
                div.className = 'select-popup-option' + (opt === selectedVal ? ' selected' : '');
                div.textContent = opt;
                div.onclick = () => {
                    onSelect(opt);
                    closeSelectPopup();
                };
                listEl.appendChild(div);
            });

            overlay.style.display = 'flex';
            overlay.classList.remove('closing');
            overlay.classList.add('open');

            overlay.onclick = (e) => {
                if (e.target === overlay) closeSelectPopup();
            };
        }

        function closeSelectPopup() {
            const overlay = document.getElementById('selectPopupOverlay');
            overlay.classList.remove('open');
            overlay.classList.add('closing');
            setTimeout(() => {
                overlay.classList.remove('closing');
                overlay.style.display = 'none';
            }, 180);
        }

        function openStoreFilterPopup() {
            const options = ['Every store', ...dealers];
            openSelectPopup('Select Store Filter', options, activeDealerFilter, (val) => {
                setDealerFilter(val);
            });
        }

        function openCategoryPopup() {
            const options = ['Produce', 'Dairy & Eggs', 'Meat & Seafood', 'Pantry & Spices', 'Snacks & Beverages', 'Household', 'Other'];
            const currentVal = document.getElementById('newItemCategoryVal').textContent;
            openSelectPopup('Select Category', options, currentVal, (val) => {
                document.getElementById('newItemCategoryVal').textContent = val;
            });
        }

        /* ── THEMED MODAL SYSTEM (replaces confirm / prompt) ── */
        function showConfirm(message, confirmLabel = 'Confirm', cancelLabel = 'Cancel', confirmStyle = '', icon = '✦',
            title = 'QuickShop') {
            return new Promise((resolve) => {
                const overlay = document.getElementById('modalOverlay');
                const card = document.getElementById('modalCard');
                const iconEl = document.getElementById('modalIcon');
                const titleEl = document.getElementById('modalTitle');
                const msgEl = document.getElementById('modalMsg');
                const inputEl = document.getElementById('modalInput');
                const cancelBtn = document.getElementById('modalCancel');
                const confirmBtn = document.getElementById('modalConfirm');

                inputEl.style.display = 'none';
                inputEl.value = '';
                msgEl.textContent = message;
                iconEl.textContent = icon;
                titleEl.textContent = title;
                cancelBtn.textContent = cancelLabel;
                confirmBtn.textContent = confirmLabel;
                confirmBtn.className = 'm-btn m-btn-confirm' + (confirmStyle ? ' ' + confirmStyle : '');

                const newCancel = cancelBtn.cloneNode(true);
                const newConfirm = confirmBtn.cloneNode(true);
                cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
                confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);

                const cleanup = () => {
                    overlay.classList.remove('open');
                    overlay.classList.add('closing');
                    setTimeout(() => {
                        overlay.classList.remove('closing');
                        overlay.style.display = 'none';
                    }, 200);
                };

                newCancel.onclick = () => { cleanup(); resolve(false); };
                newConfirm.onclick = () => { cleanup(); resolve(true); };

                overlay.onclick = (e) => {
                    if (e.target === overlay) { cleanup(); resolve(false); }
                };

                const escHandler = (e) => {
                    if (e.key === 'Escape') {
                        cleanup();
                        resolve(false);
                        document.removeEventListener('keydown', escHandler);
                    }
                };
                document.addEventListener('keydown', escHandler);

                overlay.style.display = 'flex';
                overlay.classList.remove('closing');
                overlay.classList.add('open');
                setTimeout(() => newConfirm.focus(), 100);
            });
        }

        function showPrompt(message, defaultValue = '', placeholder = '', confirmLabel = 'Submit', cancelLabel = 'Cancel',
            icon = '✏️', title = 'QuickShop') {
            return new Promise((resolve) => {
                const overlay = document.getElementById('modalOverlay');
                const card = document.getElementById('modalCard');
                const iconEl = document.getElementById('modalIcon');
                const titleEl = document.getElementById('modalTitle');
                const msgEl = document.getElementById('modalMsg');
                const inputEl = document.getElementById('modalInput');
                const cancelBtn = document.getElementById('modalCancel');
                const confirmBtn = document.getElementById('modalConfirm');

                inputEl.style.display = 'block';
                inputEl.value = defaultValue || '';
                inputEl.placeholder = placeholder || '';
                msgEl.textContent = message;
                iconEl.textContent = icon;
                titleEl.textContent = title;
                cancelBtn.textContent = cancelLabel;
                confirmBtn.textContent = confirmLabel;
                confirmBtn.className = 'm-btn m-btn-confirm';

                const newCancel = cancelBtn.cloneNode(true);
                const newConfirm = confirmBtn.cloneNode(true);
                cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
                confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);

                const cleanup = () => {
                    overlay.classList.remove('open');
                    overlay.classList.add('closing');
                    setTimeout(() => {
                        overlay.classList.remove('closing');
                        overlay.style.display = 'none';
                    }, 200);
                };

                newCancel.onclick = () => { cleanup(); resolve(null); };
                newConfirm.onclick = () => {
                    const val = inputEl.value.trim();
                    cleanup();
                    resolve(val || null);
                };

                inputEl.onkeydown = (e) => {
                    if (e.key === 'Enter') {
                        const val = inputEl.value.trim();
                        cleanup();
                        resolve(val || null);
                    }
                };

                overlay.onclick = (e) => {
                    if (e.target === overlay) { cleanup(); resolve(null); }
                };

                const escHandler = (e) => {
                    if (e.key === 'Escape') {
                        cleanup();
                        resolve(null);
                        document.removeEventListener('keydown', escHandler);
                    }
                };
                document.addEventListener('keydown', escHandler);

                overlay.style.display = 'flex';
                overlay.classList.remove('closing');
                overlay.classList.add('open');
                setTimeout(() => { inputEl.focus(); inputEl.select(); }, 100);
            });
        }

        /* ── HELPERS ── */
        function parseName(raw) {
            const p = raw.split('|').map(s => s.trim());
            return { primary: p[0] || '', alt: p[1] || '', cat: (p[2] || 'Other') };
        }

        function getCategory(raw) { return parseName(raw).cat; }

        /* ── TABS ── */
        function switchTab(tab) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.ni').forEach(n => n.classList.remove('on'));
            document.getElementById(`page-${tab}`).classList.add('active');
            document.getElementById(`nav-${tab}`).classList.add('on');
            if (tab === 'cart') renderBasket();
        }

        function showForm(type) {
            document.getElementById('addItemBox').style.display = type === 'item' ? 'block' : 'none';
            document.getElementById('addDealerBox').style.display = type === 'dealer' ? 'block' : 'none';
            document.getElementById('typeBtnItem').classList.toggle('on', type === 'item');
            document.getElementById('typeBtnDealer').classList.toggle('on', type === 'dealer');
        }

        /* ── ALPHABETICAL SCROLLBAR ── */
        function initAlphaScroll() {
            const scroll = document.getElementById('alphaScroll');
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            scroll.innerHTML = letters.map(l =>
                `<div class="alpha-letter" onclick="scrollToLetter('${l}')">${l}</div>`).join('');
        }

        function scrollToLetter(letter) {
            const grid = document.getElementById('productsGrid');
            const items = Array.from(grid.querySelectorAll('.prod-card'));
            let target = items.find(card => card.dataset.name.toUpperCase().startsWith(letter));
            if (!target) target = items.find(card => card.dataset.name.toUpperCase().localeCompare(letter) >= 0);
            if (!target && items.length > 0) target = items[items.length - 1];
            if (target) { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
        }

        /* ── SHOP RENDER ── */
        function initData() {
            const sd = new Set(),
                sc = new Set();
            Object.keys(groceries).forEach(item => { sc.add(getCategory(item));
                groceries[item].forEach(d => sd.add(d.dealer)); });
            dealers = [...sd].sort((a, b) => a.localeCompare(b));
            categories = [...sc].sort((a, b) => a.localeCompare(b));
            if (categories.includes('Other')) {
                categories = categories.filter(c => c !== 'Other');
                categories.push('Other');
            }
            renderCategoryBar();
        }

        function renderCategoryBar() {
            const container = document.getElementById('filtersContainer');
            let html = `
                <div class="store-row">
                    <span class="chips-label">Market shelves</span>
                    <div class="store-select-trigger" onclick="openStoreFilterPopup()">
                        <span>${activeDealerFilter}</span>
                    </div>
                </div>
                <div class="category-row">
                    <span class="chips-label" style="margin-right: 10px; color:var(--text-muted);">Aisle</span>
                    <div class="chips-scroll">
                        <button class="chip ${!activeCategoryFilter ? 'on' : ''}" onclick="setCategoryFilter(null)">All items</button>
                        ${categories.map(c => `<button class="chip ${activeCategoryFilter === c ? 'on' : ''}" onclick="setCategoryFilter('${c.replace(/'/g, "\\'")}')">${c}</button>`).join('')}
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function setCategoryFilter(cat) { activeCategoryFilter = cat;
            renderCategoryBar();
            renderShopGrid(); }

        function setDealerFilter(d) { activeDealerFilter = d;
            renderCategoryBar();
            renderShopGrid(); }

        function handleSearch() {
            activeSearchFilter = document.getElementById('itemInput').value.toLowerCase();
            renderShopGrid();
        }

        function renderShopGrid() {
            const da = document.getElementById('displayArea');
            da.classList.remove('open', 'closing');
            da.style.display = 'none';
            document.getElementById('shopLayout').style.display = 'flex';
            const grid = document.getElementById('productsGrid');
            let items = Object.keys(groceries).sort((a, b) => a.localeCompare(b));
            grid.innerHTML = '';
            let count = 0;
            items.forEach(item => {
                if (activeSearchFilter && !item.toLowerCase().includes(activeSearchFilter)) return;
                if (activeCategoryFilter && getCategory(item) !== activeCategoryFilter) return;
                const itemDealers = groceries[item];
                if (activeDealerFilter !== 'Every store' && !itemDealers.some(d => d.dealer === activeDealerFilter))
                return;
                let dp = itemDealers[0].price,
                    dd = itemDealers[0].dealer;
                if (activeDealerFilter !== 'Every store') {
                    const m = itemDealers.find(d => d.dealer === activeDealerFilter);
                    if (m) { dp = m.price;
                        dd = m.dealer; }
                }
                const sn = item.replace(/'/g, "\\'"),
                    sdd = dd.replace(/'/g, "\\'");
                const cat = getCategory(item);
                const topBg = catColorMap[cat] || 'var(--cat-default)';
                const parsedName = parseName(item);
                grid.innerHTML += `
                        <div class="prod-card" data-name="${parsedName.primary}" onclick="selectItem('${sn}')">
                            <div class="prod-card-top" style="background: ${topBg};">
                                <span class="prod-tag">${cat}</span>
                                <span class="prod-leaf">
                                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 5.52 4.48 10 10 10s10-4.48 10-10c0-5.52-4.48-10-10-10zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                                </span>
                            </div>
                            <div class="prod-info">
                                <div class="prod-name">${parsedName.primary}</div>
                                ${parsedName.alt ? `<div class="prod-alt">${parsedName.alt}</div>` : ''}
                                <div class="prod-foot">
                                    <div class="prod-price-wrap">
                                        <span class="prod-price">₹${dp}</span>
                                        <span class="prod-store">🏪 ${dd}</span>
                                    </div>
                                    <button class="add-btn" onclick="addCartItem('${sn}',${dp},'${sdd}');event.stopPropagation()">+</button>
                                </div>
                            </div>
                        </div>`;
                count++;
            });
            if (!count) grid.innerHTML =
                `<p style="grid-column:span 2;text-align:center;color:var(--text-muted);font-family:'Fredoka',cursive;font-size:16px;padding:40px 0;">No items found.</p>`;
        }

        /* ── CART ── */
        function addCartItem(item, price, dealer = 'Any Store') {
            const k = item.toLowerCase(),
                ex = Object.keys(cart).find(c => c.toLowerCase() === k);
            if (ex) { cart[ex].qty += 1;
                cart[ex].checked = false; } else { cart[item] = { qty: 1, price, dealer, custom: false, checked: false }; }
            toast(`Added to basket`);
            updateBadge();
            localStorage.setItem('grocery_cart', JSON.stringify(cart));
        }

        async function addCustomItem() {
            const val = await showPrompt(
                'Enter custom item name & quantity (e.g. "500g paneer")',
                '',
                'e.g. 500g paneer',
                'Add',
                'Cancel',
                '🧺',
                'Custom Item'
            );
            if (!val) return;
            let name = val.trim(),
                qty = 1;
            const k = name.toLowerCase(),
                ex = Object.keys(cart).find(c => c.toLowerCase() === k);
            if (ex) { cart[ex].qty += qty;
                cart[ex].checked = false; } else { cart[name] = { qty, custom: true, dealer: 'Any Store',
                checked: false }; }
            updateBadge();
            localStorage.setItem('grocery_cart', JSON.stringify(cart));
            renderBasket();
        }

        function modifyQty(item, delta) {
            const next = Math.round(((cart[item].qty || 0) + delta) * 100) / 100;
            if (next <= 0) delete cart[item];
            else cart[item].qty = next;
            renderBasket();
        }

        function updateQty(item, val) {
            const q = parseFloat(val);
            if (!q || q <= 0) delete cart[item];
            else cart[item].qty = parseFloat(q.toFixed(2));
            renderBasket();
        }

        function toggleCheck(item) {
            if (cart[item]) { cart[item].checked = !cart[item].checked;
                localStorage.setItem('grocery_cart', JSON.stringify(cart));
                renderBasket(); }
        }

        async function clearCart() {
            const ok = await showConfirm(
                '🗑️ Clear your entire basket? This cannot be undone.',
                'Yes, clear',
                'Cancel',
                'danger',
                '🧹',
                'Clear Basket'
            );
            if (!ok) return;
            cart = {};
            localStorage.setItem('grocery_cart', JSON.stringify(cart));
            renderBasket();
            toast("Basket cleared");
        }

        function setCartSort(m) {
            cartSortMode = m;
            document.getElementById('tabAisle').classList.toggle('on', m === 'aisle');
            document.getElementById('tabStore').classList.toggle('on', m === 'store');
            renderBasket();
        }

        function updateBadge() {
            const b = document.getElementById('cartBadge');
            const tb = document.getElementById('cartTitleBadge');
            const n = Object.keys(cart).length;
            b.textContent = n;
            b.classList.toggle('off', n === 0);
            tb.textContent = n;
        }

function renderBasket() {
    const box = document.getElementById('basketItems');
    const fBox = document.getElementById('cartFooterBox');
    const count = Object.keys(cart).length;
    updateBadge();
    document.getElementById('cartTotalCount').textContent = count;
    if (count === 0) {
        box.innerHTML =
            `<p style="padding:40px 0; text-align:center; color:var(--text-muted); font-family:'Fredoka',cursive;">Your basket is empty.</p>`;
        fBox.style.display = 'none';
        return;
    }
    fBox.style.display = 'block';
    box.innerHTML = '';
    const groups = {};
    Object.keys(cart).forEach(item => {
        const gk = cart[item].custom ? "Custom" : (cartSortMode === 'store' ? (cart[item].dealer ||
            'Any Store') : getCategory(item));
        if (!groups[gk]) groups[gk] = [];
        groups[gk].push(item);
    });
    Object.keys(groups).sort().forEach(g => {
        box.innerHTML += `<div class="group-lbl">${g}</div>`;
        groups[g].sort().forEach(item => {
            const b = cart[item];
            const si = item.replace(/'/g, "\\'");
            const unitLabel = b.unit ? ` · <b>${b.qty} ${b.unit}</b>` : '';
            
            box.innerHTML += `
                    <div class="cart-item ${b.checked ? 'done' : ''}">
                        <div class="check-ring" onclick="toggleCheck('${si}')">✓</div>
                        <div class="ci-info">
                            <div class="ci-name">${parseName(item).primary} ${b.custom ? '<span class="custom-tag">CUSTOM</span>' : ''}</div>
                            ${b.price ? `<div class="ci-sub">${b.dealer} · ₹${b.price}${unitLabel}</div>` : `<div class="ci-sub">${b.dealer}${unitLabel}</div>`}
                        </div>
                        <div class="qty-ctrl">
                            <button class="qb" onclick="modifyQty('${si}',-1)">−</button>
                            <input type="number" class="qi" value="${b.qty}" step="0.05" onchange="updateQty('${si}',this.value)">
                            <button class="qb" onclick="modifyQty('${si}',1)">+</button>
                        </div>
                    </div>`;
        });
    });
    localStorage.setItem('grocery_cart', JSON.stringify(cart));
}

async function sendToGoogleTasks() {
    if (!navigator.onLine) {
        toast("You're offline. Connect and try again.");
        return;
    }
    const items = Object.keys(cart).map(i => ({ 
        name: i, 
        qty: cart[i].unit ? `${cart[i].qty} ${cart[i].unit}` : cart[i].qty, 
        dealer: cart[i].dealer || 'Any Store' 
    }));
    try {
        await fetch(TASK_API_URL, { method: "POST", body: JSON.stringify({ listName: "Shopping List", items }) });
        toast("Synced to Tasks ✨");
    } catch (_) {
        toast("Sync failed. Please try again.");
    }
}

        /* ── DETAILS & SMOOTH TRANSITIONS ── */
        function selectItem(item) {
            selectedItem = item;
            const p = parseName(item);
            document.getElementById('itemInput').value = p.primary;
            const da = document.getElementById('displayArea');
            const sI = item.replace(/'/g, "\\'");
            let html = `
                    <div class="detail-back" onclick="clearDisplay()">← Back to list</div>
                    <div class="detail-name">${p.primary}</div>
                    ${p.alt ? `<div class="detail-alt">${p.alt}</div>` : ''}
                    <div style="margin-top: 24px; font-family:'Fredoka',cursive; font-weight:700; font-size:20px;">Prices & Stores</div>
                    <div style="margin-top: 14px;">
                `;
            groceries[item].forEach(d => {
                const sD = d.dealer.replace(/'/g, "\\'");
                html += `<div style="padding:16px; border:var(--border-width) solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-sm); background:#fff; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-weight:700; font-family:'Fredoka',cursive;">${d.dealer}</div>
                            <div style="font-size:13px; font-family:'Fredoka',cursive; color:var(--text-muted); margin-top:2px;">₹${d.price}</div>
                        </div>
                        <div style="display:flex; gap:8px;">
                            <button class="del-dealer-btn" onclick="deleteDealer('${sI}','${sD}')" title="Remove store">🗑️</button>
                            <button class="add-btn" onclick="addCartItem('${sI}',${d.price},'${sD}')">+</button>
                        </div>
                    </div>`;
            });
            html += `</div>
                    <button class="del-item-btn" onclick="deleteItem('${sI}')">Delete Item from Catalog</button>
                `;
            da.innerHTML = html;
            da.style.display = 'flex';
            da.classList.remove('closing');
            da.classList.add('open');
            setTimeout(() => {
                if (da.classList.contains('open')) { document.getElementById('shopLayout').style.display =
                    'none'; }
            }, 250);
        }

        function clearDisplay() {
            const da = document.getElementById('displayArea');
            document.getElementById('shopLayout').style.display = 'flex';
            da.classList.remove('open');
            da.classList.add('closing');
            setTimeout(() => {
                da.classList.remove('closing');
                da.style.display = 'none';
                da.innerHTML = '';
                document.getElementById('itemInput').value = '';
                activeSearchFilter = '';
                renderShopGrid();
            }, 200);
        }

        /* ── BACKEND INTEGRATION FUNCTIONS ── */

        function saveNewItem() {
            const pName = document.getElementById('newItemName').value.trim();
            const aName = document.getElementById('newAltName').value.trim();
            const cat = document.getElementById('newItemCategoryVal').textContent;
            const dealer = document.getElementById('newItemDealer').value.trim();
            const price = Number(document.getElementById('newItemPrice').value);
            if (!pName || !dealer || isNaN(price) || price <= 0) {
                toast("Fill all required fields");
                return;
            }
            const finalKey = `${pName} | ${aName} | ${cat}`;
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "add", item: finalKey, dealer, price, key: API_KEY })
            }).then(() => {
                toast("Item saved! 🛒");
                if (!groceries[finalKey]) groceries[finalKey] = [];
                groceries[finalKey].push({ dealer, price, updated: Date.now() });
                localStorage.setItem('grocery_catalog', JSON.stringify(groceries));
                ['newItemName', 'newAltName', 'newItemDealer', 'newItemPrice'].forEach(id => document.getElementById(id)
                    .value = '');
                initData();
                switchTab('shop');
                selectItem(finalKey);
            }).catch(() => toast("Failed to save."));
        }

        function addDealer() {
            const dealer = document.getElementById('dealerName').value.trim();
            const price = Number(document.getElementById('dealerPrice').value);
            if (!dealer || isNaN(price) || price <= 0 || !selectedItem) {
                toast("Select an item first in Shop!");
                return;
            }
            const exists = groceries[selectedItem].find(d => d.dealer.toLowerCase() === dealer.toLowerCase());
            const action = exists ? "update" : "add";
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: action, item: selectedItem, dealer, price, key: API_KEY })
            }).then(() => {
                toast(exists ? "Price updated!" : "Store added!");
                if (exists) { exists.price = price;
                    exists.updated = Date.now(); } else { groceries[selectedItem].push({ dealer, price,
                        updated: Date.now() }); }
                localStorage.setItem('grocery_catalog', JSON.stringify(groceries));
                document.getElementById('dealerName').value = '';
                document.getElementById('dealerPrice').value = '';
                initData();
                switchTab('shop');
                selectItem(selectedItem);
            }).catch(() => toast("Failed to save."));
        }

        async function deleteItem(item) {
            const ok = await showConfirm(
                `🗑️ Delete "${parseName(item).primary}" entirely from the catalog?`,
                'Yes, delete',
                'Cancel',
                'danger',
                '🗑️',
                'Delete Item'
            );
            if (!ok) return;
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "deleteItem", item, key: API_KEY })
            }).then(() => {
                delete groceries[item];
                selectedItem = '';
                localStorage.setItem('grocery_catalog', JSON.stringify(groceries));
                initData();
                clearDisplay();
                renderShopGrid();
                toast("Item deleted");
            }).catch(() => toast("Failed to delete."));
        }

        async function deleteDealer(item, dealer) {
            const ok = await showConfirm(
                `Remove "${dealer}" from ${parseName(item).primary}?`,
                'Remove',
                'Cancel',
                'danger',
                '🏪',
                'Remove Store'
            );
            if (!ok) return;
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "delete", item, dealer, key: API_KEY })
            }).then(() => {
                groceries[item] = groceries[item].filter(d => d.dealer !== dealer);
                if (groceries[item].length === 0) { delete groceries[item];
                    clearDisplay(); } else { selectItem(item); }
                localStorage.setItem('grocery_catalog', JSON.stringify(groceries));
                initData();
                renderShopGrid();
                toast("Store removed");
            }).catch(() => toast("Failed to delete store."));
        }

        /* ── SUGGESTION DROPDOWNS FOR STORES ── */
        let dealerIdx = {};

        function filterDealerSuggestions(input, boxId) {
            const v = input.value.toLowerCase(),
                box = document.getElementById(boxId);
            box.innerHTML = '';
            dealerIdx[boxId] = -1;
            if (!v) return;
            dealers.filter(d => d.toLowerCase().includes(v)).forEach(d => {
                const div = document.createElement('div');
                div.className = 'sug-item';
                div.textContent = d;
                div.onclick = () => { input.value = d;
                    box.innerHTML = ''; };
                box.appendChild(div);
            });
        }

        function handleDealerKeys(e, boxId, input) {
            const box = document.getElementById(boxId),
                items = [...box.children];
            if (!items.length) return;
            if (e.key === 'ArrowDown') { e.preventDefault();
                dealerIdx[boxId] = (dealerIdx[boxId] + 1) % items.length; } else if (e.key === 'ArrowUp') { e
                    .preventDefault();
                dealerIdx[boxId] = (dealerIdx[boxId] - 1 + items.length) % items.length; } else if (e.key === 'Enter') { e
                    .preventDefault();
                input.value = items[dealerIdx[boxId] ?? 0].textContent;
                box.innerHTML = ''; }
        }

        async function suggestWithGoogleTranslate() {
            const primaryName = document.getElementById('newItemName').value.trim();
            if (!primaryName) { toast("Please enter a name first!"); return; }
            toast("Translating...");
            try {
                const transliterateUrl =
                    `https://inputtools.google.com/request?text=${encodeURIComponent(primaryName)}&itc=te-t-i0-und&num=1&cp=0&cs=1&ie=utf-8&oe=utf-8`;
                const transResponse = await fetch(transliterateUrl);
                const transData = await transResponse.json();
                let teluguText = primaryName;
                if (transData && transData[0] === 'SUCCESS') { teluguText = transData[1][0][1][0]; }
                const translateUrl =
                    `https://translate.googleapis.com/translate_a/single?client=gtx&sl=te&tl=en&dt=t&q=${encodeURIComponent(teluguText)}`;
                const translateResponse = await fetch(translateUrl);
                const translateData = await translateResponse.json();
                if (translateData && translateData[0] && translateData[0][0] && translateData[0][0][0]) {
                    document.getElementById('newAltName').value = translateData[0][0][0];
                    toast("Translated successfully! 🌐");
                } else { toast("Translation not found."); }
            } catch (_) { toast("Network error during translation."); }
        }

        async function suggestWithGemini() {
            const primaryName = document.getElementById('newItemName').value.trim();
            if (!primaryName) { toast("Please enter a primary name first!"); return; }
            let geminiApiKey = localStorage.getItem('gemini_api_key');
            if (!geminiApiKey) {
                const key = await showPrompt(
                    'Enter your Gemini API Key (saved locally)',
                    '',
                    'Paste your API key',
                    'Save',
                    'Cancel',
                    '🔑',
                    'Gemini API Key'
                );
                if (!key) return;
                geminiApiKey = key.trim();
                localStorage.setItem('gemini_api_key', geminiApiKey);
            }
            toast("Gemini is thinking... ✨");
            const promptText =
                `You are a grocery assistant. Given the grocery item name "${primaryName}" (which might be typed in phonetic English/Telugu script), provide:
                1. An English or alternative common name.
                2. Choose strictly ONE category from this exact list: Produce, Dairy & Eggs, Meat & Seafood, Pantry & Spices, Snacks & Beverages, Household, Other.
                Respond ONLY in valid JSON format with this exact structure:
                {"altName": "...", "category": "..."}`;
            try {
                const url =
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${geminiApiKey}`;
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });
                const data = await response.json();
                if (data.error) {
                    if (data.error.code === 400 || data.error.status === 'INVALID_ARGUMENT') { localStorage
                            .removeItem('gemini_api_key'); }
                    toast("Gemini Error: " + (data.error.message || "Request failed"));
                    return;
                }
                const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (resultText) {
                    const parsed = JSON.parse(resultText);
                    if (parsed.altName) document.getElementById('newAltName').value = parsed.altName;
                    if (parsed.category) setCategoryDropdown(parsed.category);
                    toast("Autofilled with Gemini! ✨");
                } else { toast("Gemini response failed."); }
            } catch (_) { toast("Network error connecting to Gemini."); }
        }

        async function suggestWithGroq() {
            const primaryName = document.getElementById('newItemName').value.trim();
            if (!primaryName) { toast("Please enter a primary name first!"); return; }
            let groqApiKey = localStorage.getItem('groq_api_key');
            if (!groqApiKey) {
                const key = await showPrompt(
                    'Enter your Groq API Key (saved locally)',
                    '',
                    'Paste your API key',
                    'Save',
                    'Cancel',
                    '🔑',
                    'Groq API Key'
                );
                if (!key) return;
                groqApiKey = key.trim();
                localStorage.setItem('groq_api_key', groqApiKey);
            }
            toast("Groq is thinking... ⚡");
            const promptText =
                `You are a grocery assistant. Given the grocery item name "${primaryName}", provide:
                1. An English or alternative common name.
                2. Choose strictly ONE category from this exact list: Produce, Dairy & Eggs, Meat & Seafood, Pantry & Spices, Snacks & Beverages, Household, Other.
                Respond ONLY in valid JSON format with this exact structure:
                {"altName": "...", "category": "..."}`;
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${groqApiKey}`
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        messages: [{ role: "user", content: promptText }],
                        response_format: { type: "json_object" }
                    })
                });
                const data = await response.json();
                if (data.error) {
                    if (data.error.code === 'invalid_api_key' || data.error.message?.includes('key')) { localStorage
                            .removeItem('groq_api_key'); }
                    toast("Groq Error: " + (data.error.message || "Request failed"));
                    return;
                }
                const resultText = data.choices?.[0]?.message?.content;
                if (resultText) {
                    const parsed = JSON.parse(resultText);
                    if (parsed.altName) document.getElementById('newAltName').value = parsed.altName;
                    if (parsed.category) setCategoryDropdown(parsed.category);
                    toast("Autofilled with Groq! ⚡");
                } else { toast("Groq response failed."); }
            } catch (_) { toast("Network error connecting to Groq."); }
        }

        function setCategoryDropdown(catVal) {
            const valEl = document.getElementById('newItemCategoryVal');
            if (valEl) valEl.textContent = catVal;
        }

async function addCustomItem() {
    const val = await showPrompt(
        'Enter custom item name & quantity (e.g. "200 grams paneer", "500 ml milk", "1.5 kg sugar", "2 dozen eggs")',
        '',
        'e.g. 200g paneer',
        'Add',
        'Cancel',
        '🧺',
        'Custom Item'
    );
    if (!val) return;

    let input = val.trim();
    let qty = 1;
    let unit = '';
    let name = input;

    // Matches numbers with optional or separated common grocery units
    const unitPattern = '(?:kg|kgs|kilo|kilos|g|gm|gms|gram|grams|l|lt|ltr|liters|liter|litre|litres|ml|milli|milliliters|millilitres|lb|lbs|pound|pounds|oz|ounce|ounces|pcs|pc|piece|pieces|pkts|pkt|pack|packs|packet|packets|bunch|bunches|doz|dozen|dz)';
    const regex = new RegExp(`^([\\d.]+)(?:\\s*(${unitPattern})\\b|\\s+)(.*)$`, 'i');

    const match = input.match(regex);

    if (match) {
        const rawNum = parseFloat(match[1]);
        const matchedUnit = (match[2] || '').toLowerCase();
        const itemName = match[3].trim();

        if (!isNaN(rawNum) && itemName.length > 0) {
            name = itemName;

            // Normalize weights and volumes
            if (/^(g|gm|gms|gram|grams)$/.test(matchedUnit)) {
                qty = parseFloat((rawNum / 1000).toFixed(3));
                unit = 'kg';
            } else if (/^(kg|kgs|kilo|kilos)$/.test(matchedUnit)) {
                qty = parseFloat(rawNum.toFixed(2));
                unit = 'kg';
            } else if (/^(ml|milli|milliliters|millilitres)$/.test(matchedUnit)) {
                qty = parseFloat((rawNum / 1000).toFixed(3));
                unit = 'L';
            } else if (/^(l|lt|ltr|liter|liters|litre|litres)$/.test(matchedUnit)) {
                qty = parseFloat(rawNum.toFixed(2));
                unit = 'L';
            } else if (/^(lb|lbs|pound|pounds)$/.test(matchedUnit)) {
                qty = parseFloat(rawNum.toFixed(2));
                unit = 'lb';
            } else if (/^(oz|ounce|ounces)$/.test(matchedUnit)) {
                qty = parseFloat(rawNum.toFixed(2));
                unit = 'oz';
            } else if (/^(pcs|pc|piece|pieces)$/.test(matchedUnit)) {
                qty = parseFloat(rawNum.toFixed(2));
                unit = 'pcs';
            } else if (/^(pkts|pkt|pack|packs|packet|packets)$/.test(matchedUnit)) {
                qty = parseFloat(rawNum.toFixed(2));
                unit = 'pack';
            } else if (/^(bunch|bunches)$/.test(matchedUnit)) {
                qty = parseFloat(rawNum.toFixed(2));
                unit = 'bunch';
            } else if (/^(doz|dozen|dz)$/.test(matchedUnit)) {
                qty = parseFloat(rawNum.toFixed(2));
                unit = 'doz';
            } else {
                qty = parseFloat(rawNum.toFixed(2));
                unit = '';
            }
        }
    }

    const k = name.toLowerCase();
    const ex = Object.keys(cart).find(c => c.toLowerCase() === k);

    if (ex) {
        cart[ex].qty = parseFloat(((cart[ex].qty || 0) + qty).toFixed(3));
        if (unit) cart[ex].unit = unit;
        cart[ex].checked = false;
    } else {
        cart[name] = { 
            qty, 
            unit,
            custom: true, 
            dealer: 'Any Store',
            checked: false 
        };
    }

    toast(`Added ${qty}${unit ? ' ' + unit : ''} × ${name}`);
    updateBadge();
    localStorage.setItem('grocery_cart', JSON.stringify(cart));
    renderBasket();
}

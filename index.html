<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuickShop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ff5964">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="QuickShop">

    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <!-- Illustrative Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Illustrative & Playful Canvas Palette */
            --bg-app: #fffbf2;
            --bg-card: #ffffff;
            --bg-input: #f6efe2;

            --text-main: #22252a;
            --text-muted: #717680;

            --border: #22252a;
            --border-width: 2px;

            /* Primary: Vibrant Playful Coral / Red */
            --primary: #ff5964;
            --primary-hover: #e64550;
            --primary-soft: #ffebee;

            /* Accents */
            --accent-yellow: #ffd166;
            --accent-green: #06d6a0;
            --accent-green-light: #e6f9f4;
            --accent-green-text: #038062;
            --accent-purple: #9b5de5;
            --accent-blue: #3a86ff;

            /* Category Colors (Pastel Pop) */
            --cat-pink: #ffb7b2;
            --cat-peach: #ffd3b6;
            --cat-teal: #a8e6cf;
            --cat-yellow: #deedaa;
            --cat-default: #e8dff5;

            /* Sizing & Organic Outlines */
            --header-h: 74px;
            --nav-h: 74px;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-pill: 9999px;

            /* Playful Flat Ink Shadows */
            --shadow-sm: 2px 2px 0px var(--border);
            --shadow-md: 3px 3px 0px var(--border);
            --shadow-lg: 5px 5px 0px var(--border);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: #e2dbcd;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        .illustrative-font {
            font-family: 'Fredoka', cursive, sans-serif;
        }

        .hand-font {
            font-family: 'Patrick Hand', cursive, sans-serif;
        }

        .shell {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            background: var(--bg-app);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            border-left: var(--border-width) solid var(--border);
            border-right: var(--border-width) solid var(--border);
        }

        /* ── HEADER ── */
        .hdr {
            height: var(--header-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 10;
            background: var(--bg-app);
            border-bottom: var(--border-width) solid var(--border);
        }
        .hdr-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .hdr-logo {
            font-size: 20px;
            background: var(--accent-yellow);
            width: 46px;
            height: 46px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            border: var(--border-width) solid var(--border);
            box-shadow: var(--shadow-sm);
            transform: rotate(-3deg);
        }
        .hdr-logo svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .hdr-title-wrap {
            display: flex;
            flex-direction: column;
        }
        .hdr-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            font-family: 'Fredoka', cursive;
            line-height: 1;
            margin-bottom: 2px;
        }
        .hdr-sub {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            font-family: 'Patrick Hand', cursive;
            letter-spacing: 0.04em;
        }

        .btn-refresh-hdr {
            border: var(--border-width) solid var(--border);
            background: var(--bg-card);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            border-radius: var(--radius-md);
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
            transition: transform 0.1s;
        }
        .btn-refresh-hdr:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--border);
        }

        /* ── CONTENT ── */
        .content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .page {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
        }
        .page.active {
            display: flex;
            animation: bouncyFade 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes bouncyFade {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.99);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── SEARCH ── */
        .search-wrap {
            padding: 16px 20px 4px;
            flex-shrink: 0;
            z-index: 5;
        }
        .search-inner {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: var(--border-width) solid var(--border);
            border-radius: var(--radius-md);
            padding: 0 14px;
            box-shadow: var(--shadow-sm);
            height: 52px;
        }
        .search-ico {
            font-size: 18px;
            color: var(--text-main);
            margin-right: 10px;
            font-weight: 800;
        }
        .search-inner input {
            flex: 1;
            height: 100%;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            color: var(--text-main);
            outline: none;
        }
        .search-inner input::placeholder {
            color: var(--text-muted);
        }
        .search-cmd {
            font-size: 11px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            color: var(--text-main);
            background: var(--accent-yellow);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1.5px solid var(--border);
        }

        /* ── FILTERS ── */
        .filters-container {
            padding: 14px 20px 12px;
            border-bottom: var(--border-width) solid var(--border);
            flex-shrink: 0;
        }
        .store-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .chips-label {
            font-size: 14px;
            font-weight: 600;
            font-family: 'Patrick Hand', cursive;
            color: var(--text-main);
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            flex-shrink: 0;
        }
        
        /* Themed Store Selector Trigger Button */
        .store-select-trigger {
            position: relative;
            background: var(--accent-green-light);
            border: var(--border-width) solid var(--border);
            border-radius: 12px;
            padding: 10.5px 28px 10.5px 12px;
            box-shadow: 2px 2px 0px var(--border);
            font-size: 13px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            color: var(--accent-green-text);
            cursor: pointer;
            text-align: right;
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            min-width: 120px;
            transition: transform 0.1s;
            
        }
        .store-select-trigger:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--border);
        }
        .store-select-trigger::after {
            content: '▾';
            position: absolute;
            right: 10px;
            top: 45%;
            transform: translateY(-50%);
            font-size: 14px;
            color: var(--accent-green-text);
            pointer-events: none;
        }

        .category-row {
            display: flex;
            align-items: center;
        }
        .chips-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            flex: 1;
            margin-left: 10px;
            align-items: center;
            padding: 2px 0 4px;
        }
        .chips-scroll::-webkit-scrollbar {
            display: none;
        }
        .chip {
            height: 36px;
            padding: 0 16px;
            border-radius: var(--radius-pill);
            border: var(--border-width) solid var(--border);
            background: var(--bg-card);
            font-size: 13px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            color: var(--text-main);
            cursor: pointer;
            white-space: nowrap;
            transition: all .15s;
            flex-shrink: 0;
            box-shadow: 2px 2px 0px var(--border);
        }
        .chip:hover {
            transform: translateY(-1px);
        }
        .chip.on {
            background: var(--primary);
            color: #fff;
            box-shadow: 2px 2px 0px var(--border);
        }

        /* ── SHOP LAYOUT & GRID ── */
        .shop-body {
            position: relative;
            display: flex;
            flex: 1;
            min-height: 0;
        }
        .prod-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-auto-rows: max-content;
            gap: 16px;
            overflow-y: auto;
            align-items: start;
            align-content: start;
            padding: 16px 36px 100px 20px;
            scrollbar-width: none;
        }
        .prod-grid::-webkit-scrollbar {
            display: none;
        }

        /* ── ALPHABETICAL SCROLLBAR ── */
        .alpha-scroll {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 16px 0 100px;
        }
        .alpha-letter {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 11px;
            font-weight: 800;
            font-family: 'Fredoka', cursive;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.1s;
        }
        .alpha-letter:hover,
        .alpha-letter:active {
            color: var(--primary);
            transform: scale(1.4);
        }

        /* ── PRODUCT CARD ── */
        .prod-card {
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            height: auto;
            cursor: pointer;
            border: var(--border-width) solid var(--border);
            border-radius: var(--radius-md);
            position: relative;
            box-shadow: var(--shadow-md);
            overflow: hidden;
            transition: transform 0.15s;
        }
        .prod-card:hover {
            transform: translateY(-2px);
        }
        .prod-card-top {
            flex-shrink: 0;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--border-width) solid var(--border);
        }
        .prod-tag {
            font-size: 10px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-main);
            line-height: 1.2;
            word-break: break-word;
        }
        .prod-leaf {
            opacity: 0.85;
            flex-shrink: 0;
            margin-left: 6px;
        }
        .prod-leaf svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2;
        }

        .prod-info {
            flex-shrink: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
        }
        .prod-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            font-family: 'Fredoka', cursive;
            line-height: 1.2;
            word-break: break-word;
            margin-bottom: 2px;
        }
        .prod-alt {
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'Patrick Hand', cursive;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        .prod-foot {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-top: auto;
            border-top: 2px dashed var(--bg-input);
            padding-top: 10px;
        }
        .prod-price-wrap {
            display: flex;
            flex-direction: column;
        }
        .prod-price {
            font-size: 18px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            color: var(--text-main);
        }
        .prod-store {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 1px;
            max-width: 85px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .add-btn {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            background: var(--accent-yellow);
            border: var(--border-width) solid var(--border);
            color: var(--text-main);
            font-size: 20px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 2px 2px 0px var(--border);
            transition: transform 0.1s;
        }
        .add-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--border);
        }

        /* ── ITEM DETAIL OVERLAY & TRANSITIONS ── */
        .detail-wrap {
            position: absolute;
            inset: 0;
            background: var(--bg-app);
            z-index: 100;
            flex-direction: column;
            overflow-y: auto;
            padding: 24px 20px 120px;
            display: none;
        }
        .detail-wrap.open {
            display: flex;
            animation: slideInUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .detail-wrap.closing {
            display: flex;
            animation: slideOutDown 0.2s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(35px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes slideOutDown {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(35px) scale(0.98);
            }
        }

        .detail-back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            color: var(--primary);
            cursor: pointer;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .detail-name {
            font-size: 34px;
            font-weight: 700;
            color: var(--text-main);
            font-family: 'Fredoka', cursive;
            line-height: 1.1;
            margin-bottom: 4px;
        }
        .detail-alt {
            font-size: 18px;
            color: var(--text-muted);
            font-family: 'Patrick Hand', cursive;
            margin-bottom: 24px;
        }
        .del-item-btn {
            width: 100%;
            margin-top: 32px;
            padding: 16px;
            background: #fff0f0;
            border: var(--border-width) solid #e53e3e;
            color: #e53e3e;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            font-size: 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: transform 0.1s;
        }
        .del-item-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px #e53e3e;
        }
        .del-dealer-btn {
            background: var(--bg-input);
            border: var(--border-width) solid var(--border);
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            color: #e53e3e;
            cursor: pointer;
            font-size: 16px;
        }

        /* ── MANAGE PAGE (ILLUSTRATIVE) ── */
        .manage-page {
            padding: 24px 20px 120px;
            overflow-y: auto;
            background: var(--bg-app);
        }
        .manage-header {
            margin-bottom: 20px;
        }
        .manage-header-sub {
            font-size: 14px;
            font-weight: 700;
            font-family: 'Patrick Hand', cursive;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }
        .manage-header h2 {
            font-size: 38px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            letter-spacing: -0.01em;
            color: var(--text-main);
            line-height: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .manage-header h2 span {
            color: var(--primary);
            font-style: normal;
        }

        .type-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .type-btn {
            flex: 1;
            height: 48px;
            border: var(--border-width) solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-card);
            font-size: 14px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            cursor: pointer;
            color: var(--text-muted);
            box-shadow: var(--shadow-sm);
            transition: all .15s;
        }
        .type-btn.on {
            background: var(--accent-yellow);
            color: var(--text-main);
            box-shadow: var(--shadow-md);
        }

        .form-card {
            padding: 22px;
            background: var(--bg-card);
            border: var(--border-width) solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }
        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        .form-header-sub {
            font-size: 13px;
            font-weight: 700;
            font-family: 'Patrick Hand', cursive;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .form-header h3 {
            font-size: 26px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            color: var(--text-main);
            line-height: 1;
        }
        .ai-wand {
            border: var(--border-width) solid var(--border);
            background: var(--bg-app);
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            border-radius: var(--radius-md);
            box-shadow: 2px 2px 0px var(--border);
            transition: transform 0.1s;
        }
        .ai-wand:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--border);
        }

        .field {
            margin-bottom: 18px;
        }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 6px;
        }
        .field input,
        .field select {
            width: 100%;
            height: 50px;
            background: var(--bg-input);
            border: var(--border-width) solid var(--border);
            padding: 0 14px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            color: var(--text-main);
            outline: none;
            border-radius: var(--radius-md);
            transition: all .2s;
            appearance: none;
        }
        .field input:focus,
        .field select:focus {
            background: var(--bg-card);
            box-shadow: var(--shadow-sm);
        }

        .save-btn {
            width: 100%;
            height: 52px;
            background: var(--primary);
            border: var(--border-width) solid var(--border);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            cursor: pointer;
            margin-top: 10px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s;
        }
        .save-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--border);
        }

        /* ── CART / BASKET ── */
        .cart-page {
            padding: 24px 20px 140px;
            overflow-y: auto;
            background: var(--bg-app);
        }
        .cart-hdr {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        .cart-hdr-sub {
            font-size: 13px;
            font-weight: 700;
            font-family: 'Patrick Hand', cursive;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .cart-title {
            font-size: 40px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            color: var(--text-main);
            line-height: 1;
        }
        .cart-title span {
            font-size: 20px;
            color: #fff;
            background: var(--primary);
            font-family: 'Fredoka', cursive;
            font-weight: 700;
            vertical-align: middle;
            margin-left: 6px;
            padding: 2px 10px;
            border-radius: var(--radius-pill);
            border: var(--border-width) solid var(--border);
        }
        .btn-custom {
            background: var(--accent-yellow);
            border: var(--border-width) solid var(--border);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            padding: 8px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
        }
        .btn-custom:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--border);
        }

        .sort-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .sort-tab {
            flex: 1;
            height: 44px;
            border: var(--border-width) solid var(--border);
            background: var(--bg-card);
            font-size: 13px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: var(--radius-md);
            box-shadow: 2px 2px 0px var(--border);
        }
        .sort-tab.on {
            background: var(--accent-teal);
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
        }

        .group-lbl {
            font-size: 14px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            color: var(--text-main);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 20px 0 10px;
            border-bottom: 2px dashed var(--border);
            margin-bottom: 14px;
        }
        .group-lbl:first-child {
            padding-top: 0;
        }

        .cart-item {
            background: var(--bg-card);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
            border: var(--border-width) solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
        }
        .check-ring {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            border: var(--border-width) solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            color: transparent;
            font-size: 16px;
            font-weight: 900;
            background: var(--bg-app);
        }
        .cart-item.done {
            opacity: 0.6;
        }
        .cart-item.done .check-ring {
            background: var(--accent-green);
            color: var(--text-main);
        }
        .ci-info {
            flex: 1;
            min-width: 0;
        }
        .ci-name {
            font-size: 16px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            color: var(--text-main);
            margin-bottom: 2px;
        }
        .ci-sub {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .qty-ctrl {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            height: 36px;
            border: var(--border-width) solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .qb {
            width: 30px;
            height: 100%;
            background: transparent;
            border: none;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            color: var(--text-main);
            cursor: pointer;
        }
        .qi {
            width: 34px;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            background: transparent;
            color: var(--text-main);
        }

        /* Cart Total Box */
        .cart-total-box {
            background: var(--accent-yellow);
            border: var(--border-width) solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-top: 28px;
            box-shadow: var(--shadow-md);
        }
        .ct-lbl {
            font-size: 12px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }
        .ct-val {
            font-size: 44px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            color: var(--text-main);
            line-height: 1;
            margin-bottom: 20px;
        }
        .cart-btns {
            display: flex;
            gap: 10px;
        }
        .c-btn {
            height: 48px;
            flex: 1;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            cursor: pointer;
            border: var(--border-width) solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            transition: transform 0.1s;
        }
        .c-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--border);
        }
        .c-btn-clear {
            background: var(--bg-card);
            color: var(--text-main);
        }
        .c-btn-sync {
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* ── BOTTOM NAV (ILLUSTRATIVE) ── */
        .nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--nav-h);
            background: var(--bg-card);
            display: flex;
            border-top: var(--border-width) solid var(--border);
            z-index: 50;
        }
        .ni {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            gap: 4px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            transition: color .2s;
            position: relative;
        }
        .ni.on {
            color: var(--primary);
        }
        .ni-ico {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .badge {
            position: absolute;
            top: 10px;
            right: calc(50% - 22px);
            background: var(--primary);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
            border: 1.5px solid var(--border);
        }
        .badge.off {
            display: none;
        }

        /* ── TOAST NOTIFICATION ── */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-yellow);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            display: none;
            z-index: 999;
            box-shadow: var(--shadow-md);
            border: var(--border-width) solid var(--border);
            align-items: center;
            gap: 8px;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            display: flex;
            animation: toastPopIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .toast.hide {
            display: flex;
            animation: toastFadeOut 0.25s ease forwards;
        }
        .toast::before {
            content: '★';
            display: inline-flex;
            width: 20px;
            height: 20px;
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        @keyframes toastPopIn {
            from {
                opacity: 0;
                transform: translate(-50%, -20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0) scale(1);
            }
        }
        @keyframes toastFadeOut {
            from {
                opacity: 1;
                transform: translate(-50%, 0) scale(1);
            }
            to {
                opacity: 0;
                transform: translate(-50%, -10px) scale(0.95);
            }
        }

        .custom-tag {
            background: var(--accent-peach);
            color: var(--text-main);
            font-size: 9px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid var(--border);
            letter-spacing: 0.05em;
            margin-left: 6px;
            vertical-align: middle;
        }

        /* ── THEMED MODAL (replaces confirm/prompt) ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: modalFadeIn 0.2s ease;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-overlay.closing {
            animation: modalFadeOut 0.18s ease forwards;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        @keyframes modalFadeOut {
            from {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            to {
                opacity: 0;
                transform: scale(0.96) translateY(12px);
            }
        }

        .modal-card {
            background: var(--bg-card);
            border: var(--border-width) solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 380px;
            width: 100%;
            padding: 28px 26px 24px;
            position: relative;
            overflow: hidden;
        }
        .modal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--primary);
            border-bottom: var(--border-width) solid var(--border);
        }
        .modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .modal-header .modal-icon {
            width: 40px;
            height: 40px;
            background: var(--accent-yellow);
            border-radius: var(--radius-sm);
            border: var(--border-width) solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }
        .modal-header .modal-title {
            font-family: 'Fredoka', cursive;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
        }
        .modal-body {
            margin: 4px 0 18px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.5;
            word-break: break-word;
        }
        .modal-body .modal-msg {
            display: block;
        }
        .modal-body .modal-input {
            width: 100%;
            height: 48px;
            margin-top: 14px;
            background: var(--bg-input);
            border: var(--border-width) solid var(--border);
            border-radius: var(--radius-md);
            padding: 0 14px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            color: var(--text-main);
            outline: none;
            transition: all .2s;
        }
        .modal-body .modal-input:focus {
            background: var(--bg-card);
            box-shadow: var(--shadow-sm);
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .modal-footer .m-btn {
            flex: 1;
            height: 48px;
            border: var(--border-width) solid var(--border);
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            font-family: 'Fredoka', cursive;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .modal-footer .m-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px var(--border);
        }
        .modal-footer .m-btn-cancel {
            background: var(--bg-card);
            color: var(--text-muted);
        }
        .modal-footer .m-btn-confirm {
            background: var(--primary);
            color: #fff;
        }
        .modal-footer .m-btn-confirm.accent {
            background: var(--accent-green);
            color: var(--text-main);
        }
        .modal-footer .m-btn-danger {
            background: #e53e3e;
            color: #fff;
            border-color: #e53e3e;
        }

        /* ── THEMED SELECTION POPUP MENU ── */
        .select-popup-overlay {
            position: fixed;
            inset: 0;
            z-index: 2500;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: modalFadeIn 0.2s ease;
        }
        .select-popup-overlay.open {
            display: flex;
        }
        .select-popup-overlay.closing {
            animation: modalFadeOut 0.18s ease forwards;
        }
        .select-popup-card {
            background: var(--bg-card);
            border: var(--border-width) solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 340px;
            width: 100%;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .select-popup-hdr {
            padding: 16px 20px;
            border-bottom: var(--border-width) solid var(--border);
            font-family: 'Fredoka', cursive;
            font-size: 18px;
            font-weight: 700;
            background: var(--accent-yellow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .select-popup-body {
            overflow-y: auto;
            padding: 8px;
        }
        .select-popup-option {
            padding: 12px 16px;
            font-family: 'Fredoka', cursive;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s;
            margin-bottom: 4px;
        }
        .select-popup-option:hover {
            background: var(--primary-soft);
        }
        .select-popup-option.selected {
            background: var(--accent-green-light);
            color: var(--accent-green-text);
        }
        .select-popup-option.selected::after {
            content: '✓';
            font-weight: 900;
        }

        /* ── SUGGESTION DROPDOWN ── */
        .sug-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: var(--border-width) solid var(--border);
            border-top: none;
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            max-height: 140px;
            overflow-y: auto;
            z-index: 20;
            box-shadow: var(--shadow-sm);
            display: none;
        }
        .sug-box:not(:empty) {
            display: block;
        }
        .sug-item {
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            cursor: pointer;
            border-bottom: 1px solid var(--bg-input);
        }
        .sug-item:hover {
            background: var(--primary-soft);
        }
        .field {
            position: relative;
        }
    </style>
</head>
<body>

    <!-- ── TOAST ── -->
    <div class="toast" id="toast">Action successful</div>

    <!-- ── THEMED MODAL ── -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card" id="modalCard">
            <div class="modal-header">
                <div class="modal-icon" id="modalIcon">✦</div>
                <div class="modal-title" id="modalTitle">QuickShop</div>
            </div>
            <div class="modal-body" id="modalBody">
                <span class="modal-msg" id="modalMsg">Are you sure?</span>
                <input class="modal-input" id="modalInput" type="text" placeholder="Type here..." style="display:none;">
            </div>
            <div class="modal-footer" id="modalFooter">
                <button class="m-btn m-btn-cancel" id="modalCancel">Cancel</button>
                <button class="m-btn m-btn-confirm" id="modalConfirm">Confirm</button>
            </div>
        </div>
    </div>

    <!-- ── THEMED SELECTION POPUP ── -->
    <div class="select-popup-overlay" id="selectPopupOverlay">
        <div class="select-popup-card">
            <div class="select-popup-hdr">
                <span id="selectPopupTitle">Select Option</span>
                <span style="cursor:pointer; font-size:16px;" onclick="closeSelectPopup()">✕</span>
            </div>
            <div class="select-popup-body" id="selectPopupList"></div>
        </div>
    </div>

    <div class="shell">

        <!-- HEADER -->
        <header class="hdr">
            <div class="hdr-brand">
                <div class="hdr-logo">
                    <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
                </div>
                <div class="hdr-title-wrap">
                    <span class="hdr-name">QuickShop</span>
                    <span class="hdr-sub">Your Daily Market List</span>
                </div>
            </div>
            <button class="btn-refresh-hdr" onclick="autoCategorizeCatalog()" title="Refresh Catalog">↻</button>
        </header>

        <div class="content">

            <!-- ══ PAGE: SHOP ══ -->
            <div class="page active" id="page-shop">
                <div class="search-wrap">
                    <div class="search-inner">
                        <span class="search-ico">⚲</span>
                        <input id="itemInput" placeholder="Search your grocery list..." oninput="handleSearch()">
                        <span class="search-cmd">⌘ K</span>
                    </div>
                </div>

                <!-- Filters Row -->
                <div class="filters-container" id="filtersContainer">
                    <!-- Re-rendered by JS -->
                </div>

                <div class="shop-body" id="shopLayout">
                    <div class="prod-grid" id="productsGrid"></div>

                    <!-- ALPHABETICAL SCROLLBAR -->
                    <div class="alpha-scroll" id="alphaScroll">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <div class="detail-wrap" id="displayArea"></div>
            </div>

            <!-- ══ PAGE: MANAGE ══ -->
            <div class="page" id="page-manage">
                <div class="manage-page">
                    <div class="manage-header">
                        <div class="manage-header-sub">Keep it fresh</div>
                        <h2>Catalog <span>desk.</span></h2>
                    </div>

                    <div class="type-row">
                        <button class="type-btn on" id="typeBtnItem" onclick="showForm('item')">+ New item</button>
                        <button class="type-btn" id="typeBtnDealer" onclick="showForm('dealer')">+ Add price</button>
                    </div>

                    <!-- New Item Form -->
                    <div class="form-card" id="addItemBox">
                        <div class="form-header">
                            <div>
                                <div class="form-header-sub">New Entry</div>
                                <h3>Create an item</h3>
                            </div>
                            <div style="display: flex; gap: 6px;">
                                <button class="ai-wand" onclick="suggestWithGemini()" title="Gemini AI">✨</button>
                                <button class="ai-wand" onclick="suggestWithGroq()" title="Groq AI">⚡</button>
                                <button class="ai-wand" onclick="suggestWithGoogleTranslate()" title="Google Translator">🌐</button>
                            </div>
                        </div>

                        <div class="field">
                            <label>Primary Name</label>
                            <input id="newItemName" placeholder="e.g. Menthikura">
                        </div>
                        <div class="field">
                            <label>English / Alt Name</label>
                            <input id="newAltName" placeholder="e.g. Fenugreek Leaves">
                        </div>
                        <div class="field">
                            <label>Category</label>
                            <div class="store-select-trigger" id="newItemCategoryTrigger" style="width:100%; text-align:left; justify-content:space-between; background:var(--bg-input); color:var(--text-main);" onclick="openCategoryPopup()">
                                <span id="newItemCategoryVal">Produce</span>
                            </div>
                        </div>
                        <div class="field" style="position:relative;">
                            <label>Store / Dealer</label>
                            <input id="newItemDealer" placeholder="Store name" oninput="filterDealerSuggestions(this,'ds1')" onkeydown="handleDealerKeys(event,'ds1',this)">
                            <div id="ds1" class="sug-box"></div>
                        </div>
                        <div class="field">
                            <label>Price (₹)</label>
                            <input id="newItemPrice" type="number" placeholder="0.00">
                        </div>
                        <button class="save-btn" onclick="saveNewItem()">+ Save to catalog</button>
                    </div>

                    <!-- Add Dealer Form -->
                    <div class="form-card" id="addDealerBox" style="display:none">
                        <div class="form-header">
                            <div>
                                <div class="form-header-sub">Update Pricing</div>
                                <h3>Add store price</h3>
                            </div>
                        </div>
                        <div class="field" style="position:relative;">
                            <label>Store Name</label>
                            <input id="dealerName" placeholder="Store name" oninput="filterDealerSuggestions(this,'ds2')" onkeydown="handleDealerKeys(event,'ds2',this)">
                            <div id="ds2" class="sug-box"></div>
                        </div>
                        <div class="field">
                            <label>Price (₹)</label>
                            <input id="dealerPrice" type="number" placeholder="0.00">
                        </div>
                        <button class="save-btn" onclick="addDealer()">+ Save Store Price</button>
                    </div>
                </div>
            </div>

            <!-- ══ PAGE: CART ══ -->
            <div class="page" id="page-cart">
                <div class="cart-page" id="cartPageScroll">
                    <div class="cart-hdr">
                        <div>
                            <div class="cart-hdr-sub">Your Running List</div>
                            <div class="cart-title">Basket <span id="cartTitleBadge">0</span></div>
                        </div>
                        <button class="btn-custom" onclick="addCustomItem()">+ Custom</button>
                    </div>

                    <div class="sort-tabs" id="cartContentTabs">
                        <button class="sort-tab on" id="tabAisle" onclick="setCartSort('aisle')">By aisle</button>
                        <button class="sort-tab" id="tabStore" onclick="setCartSort('store')">By store</button>
                    </div>

                    <div id="basketItems"></div>

                    <div class="cart-total-box" id="cartFooterBox" style="display:none">
                        <div class="ct-lbl">Total Items</div>
                        <div class="ct-val" id="cartTotalCount">0</div>
                        <div class="cart-btns">
                            <button class="c-btn c-btn-clear" onclick="clearCart()">Clear</button>
                            <button class="c-btn c-btn-sync" onclick="sendToGoogleTasks()">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg> Sync tasks
                            </button>
                        </div>
                    </div>

                </div>

        </div><!-- /content -->

        <!-- NAV -->
        <nav class="nav">

                <svg class="ni-ico" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
                <span>Shop</span>
            </div>
            <div class="ni" id="nav-cart" onclick="switchTab('cart')">
                <svg class="ni-ico" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
                <span>Basket</span>
                <div class="badge off" id="cartBadge">0</div>
            </div>
            <div class="ni" id="nav-manage" onclick="switchTab('manage')">
                <svg class="ni-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09A1.65 1.65 0 0 0-1.51 1z"/></svg>
                <span>Catalog</span>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QuickShop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
:root {
  /* Earthy & Editorial Palette */
  --bg-app: #f9f6f0; 
  --bg-card: #ffffff;
  --bg-input: #f2efe9;
  
  --text-main: #252422; 
  --text-muted: #8a8580; 
  
  --border: #e6e2db;
  
  /* Primary: Terracotta / Rust */
  --primary: #c34b32; 
  --primary-hover: #a13a24;
  --primary-soft: #f2e8e3;
  
  /* Accents */
  --accent-green: #285b43;
  --accent-green-light: #e2f3e8;
  --accent-green-text: #227048;
  
  /* Category Colors */
  --cat-pink: #d2a7b6;
  --cat-peach: #eeb694;
  --cat-teal: #a7cdc9;
  --cat-default: #d3ccc3;

  /* Sizing & Layout */
  --header-h: 72px;
  --nav-h: 70px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 9999px;
  
  /* Shadows */
  --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

body { 
  font-family: 'Inter', system-ui, sans-serif; 
  background: #d4d0c9; 
  display: flex; 
  justify-content: center; 
  height: 100vh; 
  overflow: hidden;
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, .serif-font {
  font-family: 'Lora', serif;
}

.shell { 
  width: 100%; 
  max-width: 430px; 
  height: 100vh; 
  background: var(--bg-app); 
  display: flex; 
  flex-direction: column; 
  position: relative; 
  box-shadow: 0 0 40px rgba(0,0,0,0.15);
  overflow: hidden;
}

/* ── HEADER ── */
.hdr { height: var(--header-h); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; z-index: 10; background: var(--bg-app); border-bottom: 1px solid var(--border); }
.hdr-brand { display: flex; align-items: center; gap: 12px; }
.hdr-logo { font-size: 20px; background: var(--accent-green); width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; }
.hdr-logo svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hdr-title-wrap { display: flex; flex-direction: column; }
.hdr-name { font-size: 22px; font-weight: 700; color: var(--text-main); font-family: 'Lora', serif; letter-spacing: -0.02em; line-height: 1; margin-bottom: 4px; }
.hdr-sub { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }

.btn-refresh-hdr { border: 1px solid var(--border); background: var(--bg-card); width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; border-radius: var(--radius-sm); color: var(--text-main); }
.btn-refresh-hdr:active { transform: scale(0.95); }

/* ── CONTENT ── */
.content { flex: 1; overflow: hidden; display: flex; flex-direction: column; position: relative; }
.page { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.page.active { display: flex; animation: fadeSlide 0.3s ease; }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* ── SEARCH ── */
.search-wrap { padding: 16px 20px 0; flex-shrink: 0; z-index: 5; }
.search-inner { position: relative; display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 12px; box-shadow: var(--shadow-sm); height: 52px; }
.search-ico { font-size: 20px; color: var(--primary); margin-right: 12px; font-weight: 600; }
.search-inner input { flex: 1; height: 100%; border: none; background: transparent; font-size: 16px; font-weight: 500; font-family: inherit; color: var(--text-main); outline: none; }
.search-inner input::placeholder { color: var(--text-muted); }
.search-cmd { font-size: 12px; font-weight: 600; color: var(--text-main); background: var(--primary-soft); padding: 6px 10px; border-radius: 4px; }
.sug-box { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--bg-card); border-radius: var(--radius-sm); max-height: 220px; overflow-y: auto; z-index: 20; box-shadow: var(--shadow-md); display: none; border: 1px solid var(--border); }
.sug-box:not(:empty) { display: block; }
.sug-item { padding: 14px 16px; font-size: 15px; font-weight: 500; cursor: pointer; border-bottom: 1px solid var(--border); }
.sug-item:hover { background: var(--bg-input); }

/* ── FILTERS ── */
.filters-container { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.store-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.chips-label { font-size: 12px; font-weight: 700; font-family: 'Lora', serif; color: var(--text-main); white-space: nowrap; text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
.store-select-wrap { position: relative; }
.store-select { appearance: none; background: transparent; border: none; font-size: 14px; font-weight: 600; color: var(--accent-green); cursor: pointer; padding-right: 16px; outline: none; text-align: right; }
.store-select-wrap::after { content: '⌄'; position: absolute; right: 0; top: 40%; transform: translateY(-50%); font-size: 16px; color: var(--accent-green); pointer-events: none; }
.category-row { display: flex; align-items: center; }
.chips-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; margin-left: 12px; align-items: center; }
.chips-scroll::-webkit-scrollbar { display: none; }
.chip { height: 36px; padding: 0 16px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--bg-card); font-size: 13px; font-weight: 500; color: var(--text-main); cursor: pointer; white-space: nowrap; transition: all .2s; flex-shrink: 0; }
.chip:hover { border-color: var(--primary); }
.chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }

/* ── SHOP LAYOUT & GRID ── */
.shop-body { position: relative; display: flex; flex: 1; min-height: 0; }
.prod-grid { 
  flex: 1; 
  display: grid; 
  grid-template-columns: repeat(2, minmax(0, 1fr)); 
  grid-auto-rows: max-content; 
  gap: 16px; 
  overflow-y: auto; 
  align-items: start; 
  align-content: start; 
  padding: 20px 36px 100px 20px; 
  scrollbar-width: none; 
}
.prod-grid::-webkit-scrollbar { display: none; }

/* ── ALPHABETICAL SCROLLBAR ── */
.alpha-scroll { position: absolute; right: 0; top: 0; bottom: 0; width: 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; padding: 20px 0 100px; }
.alpha-letter { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; font-size: 10px; font-weight: 700; color: var(--text-muted); cursor: pointer; transition: all 0.1s; }
.alpha-letter:hover, .alpha-letter:active { color: var(--primary); transform: scale(1.3); font-size: 12px; }

/* ── PRODUCT CARD ── */
.prod-card { 
  background: var(--bg-card); 
  display: flex; 
  flex-direction: column; 
  height: auto; 
  cursor: pointer; 
  border: 1px solid var(--border); 
  border-radius: var(--radius-md); 
  position: relative; 
  box-shadow: var(--shadow-sm); 
  overflow: hidden; 
}
.prod-card-top { 
  flex-shrink: 0; 
  padding: 10px 12px; 
  display: flex; 
  justify-content: space-between; 
  align-items: flex-start; 
  border-bottom: 1px solid rgba(0,0,0,0.05); 
}
.prod-tag { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(0,0,0,0.65); line-height: 1.4; word-break: break-word; }
.prod-leaf { opacity: 0.6; flex-shrink: 0; margin-left: 8px; }
.prod-leaf svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; }

.prod-info { 
  flex-shrink: 0; 
  padding: 14px 12px 14px; 
  display: flex; 
  flex-direction: column; 
  background: var(--bg-card); 
}
.prod-name { font-size: 15px; font-weight: 700; color: var(--text-main); font-family: 'Lora', serif; line-height: 1.2; word-break: break-word; margin-bottom: 4px; }
.prod-alt { font-size: 12px; color: var(--text-muted); font-weight: 500; display: block; margin-bottom: 8px; }

.prod-foot { 
  display: flex; 
  align-items: flex-end; 
  justify-content: space-between; 
  margin-top: auto; 
  border-top: 1px dotted var(--border); 
  padding-top: 12px; 
}
.prod-price-wrap { display: flex; flex-direction: column; }
.prod-price { font-size: 17px; font-weight: 700; color: var(--text-main); }
.prod-store { font-size: 10px; color: var(--text-muted); margin-top: 2px; max-width: 90px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.add-btn { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); border: none; color: #fff; font-size: 18px; font-weight: 400; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: var(--shadow-sm); }
.add-btn:active { transform: scale(0.95); }

/* ── ITEM DETAIL OVERLAY ── */
.detail-wrap { position: absolute; inset: 0; background: var(--bg-app); z-index: 100; flex-direction: column; overflow-y: auto; padding: 24px 20px 120px; display: none; }
.detail-back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--primary); cursor: pointer; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.05em; }
.detail-name { font-size: 32px; font-weight: 700; color: var(--text-main); font-family: 'Lora', serif; line-height: 1.1; margin-bottom: 8px; }
.detail-alt { font-size: 16px; color: var(--text-muted); margin-bottom: 32px; }
.del-item-btn { width: 100%; margin-top: 32px; padding: 16px; background: transparent; border: 2px solid #e53e3e; color: #e53e3e; font-weight: 600; font-size: 15px; border-radius: var(--radius-md); cursor: pointer; transition: all 0.2s; }
.del-item-btn:hover { background: #fef2f2; }
.del-dealer-btn { background: var(--bg-input); border: none; padding: 8px 12px; border-radius: 6px; color: #e53e3e; cursor: pointer; font-size: 16px; transition: background 0.2s; }
.del-dealer-btn:hover { background: #fef2f2; }

/* ── MANAGE PAGE (EDITORIAL) ── */
.manage-page { padding: 32px 20px 120px; overflow-y: auto; background: var(--bg-app); }
.manage-header { margin-bottom: 24px; }
.manage-header-sub { font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
.manage-header h2 { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-main); line-height: 1; display: flex; align-items: center; gap: 12px; }
.manage-header h2 span { color: var(--primary); font-style: italic; }

.type-row { display: flex; margin-bottom: 24px; background: var(--primary-soft); }
.type-btn { flex: 1; height: 50px; border: none; background: transparent; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--text-muted); transition: all .2s; }
.type-btn.on { background: var(--bg-card); color: var(--primary); box-shadow: var(--shadow-sm); }

.form-card { padding: 24px; background: var(--bg-card); border: 1px solid var(--border); }
.form-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
.form-header-sub { font-size: 10px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 6px; }
.form-header h3 { font-size: 26px; font-weight: 700; color: var(--text-main); line-height: 1; }
.ai-wand { border: 1px solid var(--border); background: transparent; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; border-radius: var(--radius-sm); }

.field { margin-bottom: 20px; }
.field label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 8px; }
.field input, .field select { width: 100%; height: 52px; background: var(--bg-input); border: 1px solid transparent; padding: 0 16px; font-size: 15px; font-weight: 500; font-family: inherit; color: var(--text-main); outline: none; transition: all .2s; appearance: none; border-radius: 0; }
.field input:focus, .field select:focus { border-color: var(--primary); background: var(--bg-card); }

.save-btn { width: 100%; height: 52px; background: var(--primary); border: none; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }

/* ── CART / BASKET ── */
.cart-page { padding: 24px 20px 140px; overflow-y: auto; background: var(--bg-app); }
.cart-hdr { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; }
.cart-hdr-sub { font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
.cart-title { font-size: 42px; font-weight: 700; font-family: 'Lora', serif; color: var(--text-main); line-height: 1; }
.cart-title span { font-size: 20px; color: var(--primary); font-family: 'Inter', sans-serif; font-weight: 700; vertical-align: top; margin-left: 4px; }
.btn-custom { background: transparent; border: none; color: var(--primary); font-size: 15px; font-weight: 600; cursor: pointer; }

.sort-tabs { display: flex; margin-bottom: 24px; background: var(--primary-soft); }
.sort-tab { flex: 1; height: 46px; border: none; background: transparent; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
.sort-tab.on { background: var(--bg-card); color: var(--primary); box-shadow: var(--shadow-sm); }

.group-lbl { font-size: 11px; font-weight: 700; color: var(--accent-green); letter-spacing: 0.1em; text-transform: uppercase; padding: 24px 0 12px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.group-lbl:first-child { padding-top: 0; }

.cart-item { background: var(--bg-card); padding: 16px; display: flex; align-items: center; gap: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
.check-ring { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; color: transparent; font-size: 14px; }
.cart-item.done { opacity: 0.5; }
.cart-item.done .check-ring { background: var(--accent-green); border-color: var(--accent-green); color: #fff; }
.ci-info { flex: 1; min-width: 0; }
.ci-name { font-size: 16px; font-weight: 700; font-family: 'Lora', serif; color: var(--text-main); margin-bottom: 6px; }
.ci-sub { font-size: 12px; color: var(--text-muted); }

.qty-ctrl { display: flex; align-items: center; background: var(--bg-input); height: 36px; border-radius: 4px; }
.qb { width: 32px; height: 100%; background: transparent; border: none; font-size: 18px; color: var(--primary); cursor: pointer; }
.qi { width: 32px; height: 100%; border: none; text-align: center; font-size: 14px; font-weight: 600; background: transparent; color: var(--text-main); }

/* Cart Total Box */
.cart-total-box { background: var(--bg-card); border: 1px solid var(--border); padding: 24px; margin-top: 32px; }
.ct-lbl { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
.ct-val { font-size: 48px; font-weight: 700; font-family: 'Lora', serif; color: var(--text-main); line-height: 1; margin-bottom: 24px; }
.cart-btns { display: flex; gap: 12px; }
.c-btn { height: 50px; flex: 1; font-size: 15px; font-weight: 600; cursor: pointer; border: none; font-family: inherit; }
.c-btn-clear { background: var(--primary-soft); color: var(--primary); }
.c-btn-sync { background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; }

/* ── BOTTOM NAV (FLAT EDITORIAL) ── */
.nav { position: absolute; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: var(--bg-card); display: flex; border-top: 1px solid var(--border); z-index: 50; }
.ni { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; gap: 6px; color: var(--text-muted); font-size: 11px; font-weight: 600; transition: color .2s; position: relative; }
.ni.on { color: var(--primary); }
.ni-ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.badge { position: absolute; top: 10px; right: calc(50% - 20px); background: var(--primary); color: #fff; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 4px; border: 2px solid var(--bg-card); }
.badge.off { display: none; }

/* ── TOAST ── */
.toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: var(--accent-green-light); color: var(--accent-green-text); padding: 12px 24px; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; display: none; z-index: 999; box-shadow: var(--shadow-md); border: 1px solid #c3e6cb; animation: popDown .3s ease; display: flex; align-items: center; gap: 8px; }
.toast::before { content: '✓'; display: inline-flex; width: 18px; height: 18px; background: var(--accent-green); color: #fff; border-radius: 50%; align-items: center; justify-content: center; font-size: 12px; }
@keyframes popDown { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }

.custom-tag { background: var(--primary-soft); color: var(--primary); font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 2px; letter-spacing: 0.05em; margin-left: 6px; vertical-align: middle; }
</style>
</head>
<body>

<div class="toast" id="toast">Action successful</div>

<div class="shell">

  <!-- HEADER -->
  <header class="hdr">
    <div class="hdr-brand">
      <div class="hdr-logo">
        <svg viewBox="0 0 24 24"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM12 12c-3.314 0-6 2.686-6 6M12 12c3.314 0 6-2.686 6-6M12 12V2M12 12v10"/></svg>
      </div>
      <div class="hdr-title-wrap">
        <span class="hdr-name">QuickShop</span>
        <span class="hdr-sub">Your Daily Market List</span>
      </div>
    </div>
    <!-- Refresh Button moved to Shop header -->
    <button class="btn-refresh-hdr" onclick="autoCategorizeCatalog()" title="Refresh Catalog">↻</button>
  </header>

  <div class="content">

    <!-- ══ PAGE: SHOP ══ -->
    <div class="page active" id="page-shop">
      <div class="search-wrap">
        <div class="search-inner">
          <span class="search-ico">⚲</span>
          <input id="itemInput" placeholder="Search your grocery list..." oninput="handleSearch()">
          <span class="search-cmd">⌘ K</span>
        </div>
      </div>

      <!-- Filters Row -->
      <div class="filters-container" id="filtersContainer">
        <!-- Re-rendered by JS -->
      </div>

      <div class="shop-body" id="shopLayout">
        <div class="prod-grid" id="productsGrid"></div>
        
        <!-- ALPHABETICAL SCROLLBAR -->
        <div class="alpha-scroll" id="alphaScroll">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="detail-wrap" id="displayArea"></div>
    </div>

    <!-- ══ PAGE: MANAGE ══ -->
    <div class="page" id="page-manage">
      <div class="manage-page">
        <div class="manage-header">
          <div class="manage-header-sub">Keep it fresh</div>
          <h2>Catalog <span>desk.</span></h2>
        </div>

        <!-- Catalog card banner removed here -->

        <div class="type-row">
          <button class="type-btn on" id="typeBtnItem" onclick="showForm('item')">New item</button>
          <button class="type-btn" id="typeBtnDealer" onclick="showForm('dealer')">Add price</button>
        </div>

        <!-- New Item Form -->
        <div class="form-card" id="addItemBox">
          <div class="form-header">
            <div>
              <div class="form-header-sub">New Entry</div>
              <h3>Create an item</h3>
            </div>
            <button class="ai-wand" onclick="suggestWithAI()" title="AI magic">✧</button>
          </div>

          <div class="field">
            <label>Primary Name</label>
            <input id="newItemName" placeholder="e.g. Menthikura">
          </div>
          <div class="field">
            <label>English / Alt Name</label>
            <input id="newAltName" placeholder="e.g. Fenugreek Leaves">
          </div>
          <div class="field">
            <label>Category</label>
            <select id="newItemCategory">
              <option value="Produce">Produce</option>
              <option value="Dairy & Eggs">Dairy & Eggs</option>
              <option value="Meat & Seafood">Meat & Seafood</option>
              <option value="Pantry & Spices">Pantry & Spices</option>
              <option value="Snacks & Beverages">Snacks & Beverages</option>
              <option value="Household">Household</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field" style="position:relative;">
            <label>Store / Dealer</label>
            <input id="newItemDealer" placeholder="Store name" oninput="filterDealerSuggestions(this,'ds1')" onkeydown="handleDealerKeys(event,'ds1',this)">
            <div id="ds1" class="sug-box"></div>
          </div>
          <div class="field">
            <label>Price (₹)</label>
            <input id="newItemPrice" type="number" placeholder="0.00">
          </div>
          <button class="save-btn" onclick="saveNewItem()">+ Save to catalog</button>
        </div>

        <!-- Add Dealer Form -->
        <div class="form-card" id="addDealerBox" style="display:none">
          <div class="form-header">
            <div>
              <div class="form-header-sub">Update Pricing</div>
              <h3>Add store price</h3>
            </div>
          </div>
          <div class="field" style="position:relative;">
            <label>Store Name</label>
            <input id="dealerName" placeholder="Store name" oninput="filterDealerSuggestions(this,'ds2')" onkeydown="handleDealerKeys(event,'ds2',this)">
            <div id="ds2" class="sug-box"></div>
          </div>
          <div class="field">
            <label>Price (₹)</label>
            <input id="dealerPrice" type="number" placeholder="0.00">
          </div>
          <button class="save-btn" onclick="addDealer()">+ Save Store Price</button>
        </div>
      </div>
    </div>

    <!-- ══ PAGE: CART ══ -->
    <div class="page" id="page-cart">
      <div class="cart-page" id="cartPageScroll">
        <div class="cart-hdr">
          <div>
            <div class="cart-hdr-sub">Your Running List</div>
            <div class="cart-title">Basket <span id="cartTitleBadge">0</span></div>
          </div>
          <button class="btn-custom" onclick="addCustomItem()">+ Custom</button>
        </div>

        <div class="sort-tabs" id="cartContentTabs">
          <button class="sort-tab on" id="tabAisle" onclick="setCartSort('aisle')">By aisle</button>
          <button class="sort-tab" id="tabStore" onclick="setCartSort('store')">By store</button>
        </div>

        <div id="basketItems"></div>

        <div class="cart-total-box" id="cartFooterBox" style="display:none">
          <div class="ct-lbl">Total Items</div>
          <div class="ct-val" id="cartTotalCount">0</div>
          <div class="cart-btns">
            <button class="c-btn c-btn-clear" onclick="clearCart()">Clear</button>
            <button class="c-btn c-btn-sync" onclick="sendToGoogleTasks()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg> Sync tasks
            </button>
          </div>
        </div>

      </div>
    </div>

  </div><!-- /content -->

  <!-- NAV -->
  <nav class="nav">
    <div class="ni on" id="nav-shop" onclick="switchTab('shop')">
      <svg class="ni-ico" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Shop</span>
    </div>
    <div class="ni" id="nav-cart" onclick="switchTab('cart')">
      <svg class="ni-ico" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Basket</span>
      <div class="badge off" id="cartBadge">0</div>
    </div>
    <div class="ni" id="nav-manage" onclick="switchTab('manage')">
      <svg class="ni-ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09A1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Catalog</span>
    </div>
  </nav>

</div>

<script>
/* ── CONSTANTS & VARS ── */
const API_URL = "https://script.google.com/macros/s/AKfycbzRt_ad2rXgZNVO4_Nlumm8EAxN7jcG7gG1y0yKEec7WXnws68ygcAqrhCjRzcmdWzl/exec";
const API_KEY = "9848o22338B!";
const TASK_API_URL = "https://script.google.com/macros/s/AKfycbz0d_gOUxq6w7geJvlt9R1hUaR8aLItOBsI1p3Cd6UCS2p1lCGvaAzVWG7rVK2tMJnE7Q/exec";

let groceries = {}, dealers = [], categories = [], cart = {};
let cartSortMode = 'aisle', selectedItem = '';
let activeDealerFilter = 'Every store', activeCategoryFilter = null;
let activeSearchFilter = '';

const catColorMap = { 
  'Produce': 'var(--cat-teal)', 
  'Snacks & Beverages': 'var(--cat-pink)', 
  'Pantry & Spices': 'var(--cat-peach)', 
  'Household': 'var(--cat-teal)',
  'Dairy & Eggs': 'var(--cat-peach)',
  'Meat & Seafood': 'var(--cat-pink)'
};

/* ── BOOT ── */
window.onload = () => {
  const cg = localStorage.getItem('grocery_catalog');
  if (cg) { groceries = JSON.parse(cg); initData(); renderShopGrid(); }
  const cc = localStorage.getItem('grocery_cart');
  if (cc) { cart = JSON.parse(cc); renderBasket(); }
  initAlphaScroll();
  if (navigator.onLine) fetchData(); 
};

function fetchData() {
  fetch(`${API_URL}?key=${API_KEY}`).then(r => r.json()).then(d => {
    groceries = d || {}; localStorage.setItem('grocery_catalog', JSON.stringify(groceries));
    initData(); renderShopGrid(); 
  }).catch(() => {});
}

function toast(msg) {
  const t = document.getElementById('toast'); 
  t.innerHTML = msg; 
  t.style.display = 'flex';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 2200);
}

/* ── HELPERS ── */
function parseName(raw) {
  const p = raw.split('|').map(s => s.trim());
  return { primary: p[0] || '', alt: p[1] || '', cat: (p[2] || 'Other') };
}
function getCategory(raw) { return parseName(raw).cat; }

/* ── TABS ── */
function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.ni').forEach(n => n.classList.remove('on'));
  document.getElementById(`page-${tab}`).classList.add('active');
  document.getElementById(`nav-${tab}`).classList.add('on');
  if (tab === 'cart') renderBasket();
}

function showForm(type) {
  document.getElementById('addItemBox').style.display = type === 'item' ? 'block' : 'none';
  document.getElementById('addDealerBox').style.display = type === 'dealer' ? 'block' : 'none';
  document.getElementById('typeBtnItem').classList.toggle('on', type === 'item');
  document.getElementById('typeBtnDealer').classList.toggle('on', type === 'dealer');
}

/* ── ALPHABETICAL SCROLLBAR ── */
function initAlphaScroll() {
  const scroll = document.getElementById('alphaScroll');
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  scroll.innerHTML = letters.map(l => `<div class="alpha-letter" onclick="scrollToLetter('${l}')">${l}</div>`).join('');
}

function scrollToLetter(letter) {
  const grid = document.getElementById('productsGrid');
  const items = Array.from(grid.querySelectorAll('.prod-card'));
  
  let target = items.find(card => card.dataset.name.toUpperCase().startsWith(letter));
  if (!target) target = items.find(card => card.dataset.name.toUpperCase().localeCompare(letter) >= 0);
  if (!target && items.length > 0) target = items[items.length - 1];

  if (target) {
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

/* ── SHOP RENDER ── */
function initData() {
  const sd = new Set(), sc = new Set();
  Object.keys(groceries).forEach(item => { sc.add(getCategory(item)); groceries[item].forEach(d => sd.add(d.dealer)); });
  
  dealers = [...sd].sort((a, b) => a.localeCompare(b));
  categories = [...sc].sort((a, b) => a.localeCompare(b));
  
  if (categories.includes('Other')) {
    categories = categories.filter(c => c !== 'Other');
    categories.push('Other');
  }
  
  renderCategoryBar();
}

function renderCategoryBar() {
  const container = document.getElementById('filtersContainer');
  let html = `
    <div class="store-row">
      <span class="chips-label">Market shelves</span>
      <div class="store-select-wrap">
        <select class="store-select" onchange="setDealerFilter(this.value)">
          <option value="Every store">Every store</option>
          ${dealers.map(d => `<option value="${d}" ${d === activeDealerFilter ? 'selected' : ''}>${d}</option>`).join('')}
        </select>
      </div>
    </div>
    
    <div class="category-row">
      <span class="chips-label" style="margin-right: 12px; color:var(--text-muted);">Aisle</span>
      <div class="chips-scroll">
        <button class="chip ${!activeCategoryFilter ? 'on' : ''}" onclick="setCategoryFilter(null)">All items</button>
        ${categories.map(c => `<button class="chip ${activeCategoryFilter === c ? 'on' : ''}" onclick="setCategoryFilter('${c.replace(/'/g, "\\'")}')">${c}</button>`).join('')}
      </div>
    </div>
  `;
  container.innerHTML = html;
}

function setCategoryFilter(cat) { activeCategoryFilter = cat; renderCategoryBar(); renderShopGrid(); }
function setDealerFilter(d) { activeDealerFilter = d; renderShopGrid(); }

function handleSearch() {
  activeSearchFilter = document.getElementById('itemInput').value.toLowerCase();
  renderShopGrid();
}

function renderShopGrid() {
  document.getElementById('displayArea').style.display = 'none';
  document.getElementById('shopLayout').style.display = 'flex';
  const grid = document.getElementById('productsGrid');
  
  let items = Object.keys(groceries).sort((a, b) => a.localeCompare(b));
  grid.innerHTML = '';
  let count = 0;
  
  items.forEach(item => {
    if (activeSearchFilter && !item.toLowerCase().includes(activeSearchFilter)) return;
    if (activeCategoryFilter && getCategory(item) !== activeCategoryFilter) return;
    
    const itemDealers = groceries[item];
    if (activeDealerFilter !== 'Every store' && !itemDealers.some(d => d.dealer === activeDealerFilter)) return;
    
    let dp = itemDealers[0].price, dd = itemDealers[0].dealer;
    if (activeDealerFilter !== 'Every store') { 
      const m = itemDealers.find(d => d.dealer === activeDealerFilter); 
      if (m) { dp = m.price; dd = m.dealer; } 
    }
    
    const sn = item.replace(/'/g, "\\'"), sdd = dd.replace(/'/g, "\\'");
    const cat = getCategory(item);
    const topBg = catColorMap[cat] || 'var(--cat-default)';
    const parsedName = parseName(item);
    
    grid.innerHTML += `
      <div class="prod-card" data-name="${parsedName.primary}" onclick="selectItem('${sn}')">
        <div class="prod-card-top" style="background: ${topBg};">
          <span class="prod-tag">${cat}</span>
          <span class="prod-leaf">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 5.52 4.48 10 10 10s10-4.48 10-10c0-5.52-4.48-10-10-10zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
          </span>
        </div>
        <div class="prod-info">
          <div class="prod-name">${parsedName.primary}</div>
          ${parsedName.alt ? `<div class="prod-alt">${parsedName.alt}</div>` : ''}
          <div class="prod-foot">
            <div class="prod-price-wrap">
              <span class="prod-price">₹${dp}</span>
              <span class="prod-store">🏪 ${dd}</span>
            </div>
            <button class="add-btn" onclick="addCartItem('${sn}',${dp},'${sdd}');event.stopPropagation()">+</button>
          </div>
        </div>
      </div>`;
    count++;
  });
  if (!count) grid.innerHTML = `<p style="grid-column:span 2;text-align:center;color:var(--text-muted);font-size:15px;padding:40px 0;">No items found.</p>`;
}

/* ── CART ── */
function addCartItem(item, price, dealer = 'Any Store') {
  const k = item.toLowerCase(), ex = Object.keys(cart).find(c => c.toLowerCase() === k);
  if (ex) { cart[ex].qty += 1; cart[ex].checked = false; }
  else { cart[item] = { qty: 1, price, dealer, custom: false, checked: false }; }
  toast(`Added to basket`);
  updateBadge(); localStorage.setItem('grocery_cart', JSON.stringify(cart));
}

function addCustomItem() {
  const inp = prompt("Enter custom item (e.g. '500g paneer'):"); if (!inp) return;
  let name = inp.trim(), qty = 1;
  const k = name.toLowerCase(), ex = Object.keys(cart).find(c => c.toLowerCase() === k);
  if (ex) { cart[ex].qty += qty; cart[ex].checked = false; }
  else { cart[name] = { qty, custom: true, dealer: 'Any Store', checked: false }; }
  updateBadge(); localStorage.setItem('grocery_cart', JSON.stringify(cart)); renderBasket();
}

function modifyQty(item, delta) {
  const next = Math.round(((cart[item].qty || 0) + delta) * 100) / 100;
  if (next <= 0) delete cart[item]; else cart[item].qty = next;
  renderBasket();
}

function updateQty(item, val) {
  const q = parseFloat(val);
  if (!q || q <= 0) delete cart[item]; else cart[item].qty = parseFloat(q.toFixed(2));
  renderBasket();
}

function toggleCheck(item) {
  if (cart[item]) { cart[item].checked = !cart[item].checked; localStorage.setItem('grocery_cart', JSON.stringify(cart)); renderBasket(); }
}

function clearCart() {
  if (!confirm("Clear your entire basket?")) return;
  cart = {};
  localStorage.setItem('grocery_cart', JSON.stringify(cart)); 
  renderBasket();
  toast("Basket cleared");
}

function setCartSort(m) {
  cartSortMode = m;
  document.getElementById('tabAisle').classList.toggle('on', m === 'aisle');
  document.getElementById('tabStore').classList.toggle('on', m === 'store');
  renderBasket();
}

function updateBadge() {
  const b = document.getElementById('cartBadge');
  const tb = document.getElementById('cartTitleBadge');
  const n = Object.keys(cart).length;
  b.textContent = n; b.classList.toggle('off', n === 0);
  tb.textContent = n;
}

function renderBasket() {
  const box = document.getElementById('basketItems');
  const fBox = document.getElementById('cartFooterBox');
  const count = Object.keys(cart).length;
  
  updateBadge();
  document.getElementById('cartTotalCount').textContent = count;
  
  if (count === 0) { 
    box.innerHTML = `<p style="padding:40px 0; text-align:center; color:var(--text-muted)">Your basket is empty.</p>`; 
    fBox.style.display = 'none'; 
    return; 
  }
  
  fBox.style.display = 'block'; 
  box.innerHTML = '';
  
  const groups = {};
  Object.keys(cart).forEach(item => {
    const gk = cart[item].custom ? "Custom" : (cartSortMode === 'store' ? (cart[item].dealer || 'Any Store') : getCategory(item));
    if (!groups[gk]) groups[gk] = [];
    groups[gk].push(item);
  });
  
  Object.keys(groups).sort().forEach(g => {
    box.innerHTML += `<div class="group-lbl">${g}</div>`;
    groups[g].sort().forEach(item => {
      const b = cart[item]; const si = item.replace(/'/g, "\\'");
      box.innerHTML += `
        <div class="cart-item ${b.checked ? 'done' : ''}">
          <div class="check-ring" onclick="toggleCheck('${si}')">✓</div>
          <div class="ci-info">
            <div class="ci-name">${parseName(item).primary} ${b.custom ? '<span class="custom-tag">CUSTOM</span>' : ''}</div>
            ${b.price ? `<div class="ci-sub">${b.dealer} · ₹${b.price}</div>` : `<div class="ci-sub">${b.dealer}</div>`}
          </div>
          <div class="qty-ctrl">
            <button class="qb" onclick="modifyQty('${si}',-1)">−</button>
            <input type="number" class="qi" value="${b.qty}" step="0.05" onchange="updateQty('${si}',this.value)">
            <button class="qb" onclick="modifyQty('${si}',1)">+</button>
          </div>
        </div>`;
    });
  });
  localStorage.setItem('grocery_cart', JSON.stringify(cart));
}

function sendToGoogleTasks() {
  if (!navigator.onLine) return alert("You're offline.");
  const items = Object.keys(cart).map(i => ({ name: i, qty: cart[i].qty, dealer: cart[i].dealer || 'Any Store' }));
  fetch(TASK_API_URL, { method: "POST", body: JSON.stringify({ listName: "Shopping List", items }) })
    .then(() => { toast("Synced to Tasks"); })
    .catch(() => { alert("Sync failed."); });
}

/* ── DETAILS & CATALOG MANAGEMENT ── */
function selectItem(item) {
  selectedItem = item;
  const p = parseName(item);
  document.getElementById('itemInput').value = p.primary;
  document.getElementById('shopLayout').style.display = 'none';
  const da = document.getElementById('displayArea');
  da.style.display = 'flex';
  
  const sI = item.replace(/'/g, "\\'");
  
  let html = `
    <div class="detail-back" onclick="clearDisplay()">← Back to list</div>
    <div class="detail-name">${p.primary}</div>
    ${p.alt ? `<div class="detail-alt">${p.alt}</div>` : ''}
    <div style="margin-top: 32px; font-family:'Lora',serif; font-weight:700; font-size:18px;">Prices & Stores</div>
    <div style="margin-top: 16px;">
  `;
  groceries[item].forEach(d => {
    const sD = d.dealer.replace(/'/g, "\\'");
    html += `<div style="padding:16px; border:1px solid var(--border); background:#fff; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-weight:600;">${d.dealer}</div>
        <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">₹${d.price}</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="del-dealer-btn" onclick="deleteDealer('${sI}','${sD}')" title="Remove store">🗑️</button>
        <button class="add-btn" onclick="addCartItem('${sI}',${d.price},'${sD}')">+</button>
      </div>
    </div>`;
  });
  
  html += `</div>
    <button class="del-item-btn" onclick="deleteItem('${sI}')">Delete Item from Catalog</button>
  `;
  
  da.innerHTML = html;
}

function clearDisplay() {
  document.getElementById('itemInput').value = '';
  activeSearchFilter = ''; 
  document.getElementById('displayArea').style.display = 'none';
  document.getElementById('displayArea').innerHTML = '';
  document.getElementById('shopLayout').style.display = 'flex';
  renderShopGrid(); 
}

/* --- BACKEND INTEGRATION FUNCTIONS --- */

function saveNewItem() {
  const pName = document.getElementById('newItemName').value.trim();
  const aName = document.getElementById('newAltName').value.trim();
  const cat = document.getElementById('newItemCategory').value;
  const dealer = document.getElementById('newItemDealer').value.trim();
  const price = Number(document.getElementById('newItemPrice').value);
  
  if (!pName || !dealer || isNaN(price) || price <= 0) return toast("Fill all required fields");
  
  const finalKey = `${pName} | ${aName} | ${cat}`;
  
  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "add", item: finalKey, dealer, price, key: API_KEY })
  }).then(() => {
    toast("Item saved! 🛒");
    
    if (!groceries[finalKey]) groceries[finalKey] = [];
    groceries[finalKey].push({ dealer, price, updated: Date.now() });
    localStorage.setItem('grocery_catalog', JSON.stringify(groceries));
    
    ['newItemName','newAltName','newItemDealer','newItemPrice'].forEach(id => document.getElementById(id).value = '');
    
    initData();
    switchTab('shop'); 
    selectItem(finalKey);
  }).catch(() => toast("Failed to save."));
}

function addDealer() {
  const dealer = document.getElementById('dealerName').value.trim();
  const price = Number(document.getElementById('dealerPrice').value);
  
  if (!dealer || isNaN(price) || price <= 0 || !selectedItem) return toast("Select an item first in Shop!");

  const exists = groceries[selectedItem].find(d => d.dealer.toLowerCase() === dealer.toLowerCase());
  const action = exists ? "update" : "add";

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: action, item: selectedItem, dealer, price, key: API_KEY })
  }).then(() => {
    toast(exists ? "Price updated!" : "Store added!");
    
    if (exists) {
      exists.price = price;
      exists.updated = Date.now();
    } else {
      groceries[selectedItem].push({ dealer, price, updated: Date.now() });
    }
    
    localStorage.setItem('grocery_catalog', JSON.stringify(groceries));
    
    document.getElementById('dealerName').value = '';
    document.getElementById('dealerPrice').value = '';
    
    initData();
    switchTab('shop'); 
    selectItem(selectedItem);
  }).catch(() => toast("Failed to save."));
}

function deleteItem(item) {
  if (!confirm("Are you sure you want to delete this item entirely from the catalog?")) return;
  
  fetch(API_URL, { 
    method: "POST", 
    body: JSON.stringify({ action: "deleteItem", item, key: API_KEY }) 
  }).then(() => {
    delete groceries[item];
    selectedItem = '';
    localStorage.setItem('grocery_catalog', JSON.stringify(groceries));
    initData();
    clearDisplay();
    renderShopGrid();
    toast("Item deleted");
  }).catch(() => toast("Failed to delete."));
}

function deleteDealer(item, dealer) {
  if (!confirm(`Remove ${dealer} from this item?`)) return;
  
  fetch(API_URL, { 
    method: "POST", 
    body: JSON.stringify({ action: "delete", item, dealer, key: API_KEY }) 
  }).then(() => {
    groceries[item] = groceries[item].filter(d => d.dealer !== dealer);
    
    if (groceries[item].length === 0) {
      delete groceries[item];
      clearDisplay();
    } else {
      selectItem(item); 
    }
    
    localStorage.setItem('grocery_catalog', JSON.stringify(groceries));
    initData();
    renderShopGrid();
    toast("Store removed");
  }).catch(() => toast("Failed to delete store."));
}

/* ── SUGGESTION DROPDOWNS FOR STORES IN MANAGE TABS ── */
let dealerIdx = {};
function filterDealerSuggestions(input, boxId) {
  const v = input.value.toLowerCase(), box = document.getElementById(boxId);
  box.innerHTML = ''; dealerIdx[boxId] = -1;
  if (!v) return;
  dealers.filter(d => d.toLowerCase().includes(v)).forEach(d => {
    const div = document.createElement('div'); div.className = 'sug-item';
    div.textContent = d; div.onclick = () => { input.value = d; box.innerHTML = ''; }; box.appendChild(div);
  });
}
function handleDealerKeys(e, boxId, input) {
  const box = document.getElementById(boxId), items = [...box.children];
  if (!items.length) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); dealerIdx[boxId] = (dealerIdx[boxId] + 1) % items.length; }
  else if (e.key === 'ArrowUp') { e.preventDefault(); dealerIdx[boxId] = (dealerIdx[boxId] - 1 + items.length) % items.length; }
  else if (e.key === 'Enter') { e.preventDefault(); input.value = items[dealerIdx[boxId] ?? 0].textContent; box.innerHTML = ''; }
}

function suggestWithAI() { toast("AI suggestion processing..."); }
function autoCategorizeCatalog() { toast("Catalog refreshed"); fetchData(); }

</script>
